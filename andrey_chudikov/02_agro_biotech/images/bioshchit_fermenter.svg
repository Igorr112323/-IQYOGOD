<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="820" height="460" fill="#ffffff"/>
  <text x="410" y="24" text-anchor="middle" font-size="15" font-weight="bold">БИОЩИТ-КУБАНЬ: ферментационная установка 50 л (схема)</text>
  <!-- реактор -->
  <rect x="300" y="70" width="180" height="240" rx="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="390" y="100" text-anchor="middle">реактор 50 л</text>
  <text x="390" y="118" text-anchor="middle">МПА + меласса 2%</text>
  <line x1="390" y1="70" x2="390" y2="300" stroke="#2e7d32"/>
  <ellipse cx="390" cy="150" rx="60" ry="8" fill="none" stroke="#2e7d32"/>
  <ellipse cx="390" cy="210" rx="60" ry="8" fill="none" stroke="#2e7d32"/>
  <text x="390" y="185" text-anchor="middle">мешалка, 120 об/мин</text>
  <text x="390" y="245" text-anchor="middle">30 °С → 22 °С (споруляция)</text>
  <!-- воздух -->
  <rect x="80" y="120" width="120" height="46" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="140" y="140" text-anchor="middle">компрессор</text>
  <text x="140" y="156" text-anchor="middle">1 об/об/мин</text>
  <line x1="200" y1="143" x2="300" y2="180" stroke="#1565c0" stroke-width="2"/>
  <text x="245" y="160" text-anchor="middle" fill="#1565c0">фильтр 0,22 мкм</text>
  <!-- контроль -->
  <rect x="600" y="90" width="150" height="80" rx="8" fill="#fff8e1" stroke="#f57f17"/>
  <text x="675" y="112" text-anchor="middle">контроллер (Шершнев И.А.)</text>
  <text x="675" y="130" text-anchor="middle">pH 7,0 ± 0,2</text>
  <text x="675" y="148" text-anchor="middle">T, DO, уровень</text>
  <line x1="480" y1="130" x2="600" y2="130" stroke="#f57f17" stroke-width="2"/>
  <!-- выгрузка -->
  <line x1="390" y1="310" x2="390" y2="345" stroke="#2e7d32" stroke-width="2"/>
  <rect x="300" y="345" width="180" height="44" rx="8" fill="#efebe9" stroke="#6d4c41"/>
  <text x="390" y="363" text-anchor="middle">напыление на шелуху риса</text>
  <text x="390" y="379" text-anchor="middle">сушка ≤ 8 % влажности</text>
  <line x1="480" y1="367" x2="600" y2="367" stroke="#6d4c41" stroke-width="2"/>
  <rect x="600" y="345" width="160" height="44" rx="8" fill="#fce4ec" stroke="#ad1457"/>
  <text x="680" y="363" text-anchor="middle">фасовка 0,4 кг/га-дозу</text>
  <text x="680" y="379" text-anchor="middle">себестоимость 68 руб.</text>
  <text x="410" y="430" text-anchor="middle" fill="#555">Титр: (2,4 ± 0,3) × 10⁹ КОЕ/мл; цикл 36 ч + 12 ч споруляции; выход 92 % спор.</text>
</svg>
