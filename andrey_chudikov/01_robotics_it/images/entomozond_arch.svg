<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="Arial" font-size="13">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold">ЭНТОМОЗОНД: устройство комплекса и распознавание кладки</text>
  <!-- шасси -->
  <rect x="90" y="260" width="220" height="70" rx="12" fill="#c9d6e2" stroke="#33475b" stroke-width="2"/>
  <rect x="80" y="310" width="240" height="30" rx="14" fill="#33475b"/>
  <circle cx="120" cy="325" r="12" fill="#8fa5ba"/><circle cx="200" cy="325" r="12" fill="#8fa5ba"/><circle cx="280" cy="325" r="12" fill="#8fa5ba"/>
  <text x="200" y="300" text-anchor="middle" font-size="11">гусеничная платформа, 140 кг</text>
  <!-- шнек -->
  <rect x="320" y="230" width="14" height="130" fill="#33475b"/>
  <path d="M 320 250 h 14 M 320 270 h 14 M 320 290 h 14 M 320 310 h 14" stroke="#ffffff" stroke-width="2"/>
  <text x="327" y="218" text-anchor="middle" font-size="11">шнек: керн ∅60 мм, 0–12 см</text>
  <!-- лоток и камера -->
  <rect x="360" y="240" width="120" height="26" rx="6" fill="#efe6d8" stroke="#33475b" stroke-width="1.5"/>
  <rect x="400" y="180" width="44" height="30" rx="6" fill="#dfe7ee" stroke="#33475b" stroke-width="2"/>
  <text x="422" y="172" text-anchor="middle" font-size="11">камера 12 Мп</text>
  <line x1="422" y1="210" x2="422" y2="240" stroke="#2b7de9" stroke-width="1.5" stroke-dasharray="4 3"/>
  <ellipse cx="420" cy="253" rx="16" ry="5" fill="#a9804f"/>
  <text x="420" y="286" text-anchor="middle" font-size="10">керн в лотке</text>
  <!-- кубышка крупно -->
  <rect x="540" y="90" width="280" height="170" fill="#f5f8fb" stroke="#33475b" stroke-width="1"/>
  <text x="680" y="114" text-anchor="middle" font-weight="bold" font-size="13">Кубышка в разрезе (датасет)</text>
  <ellipse cx="620" cy="180" rx="18" ry="48" fill="#c9a86a" stroke="#7a5b2e" stroke-width="2"/>
  <circle cx="615" cy="150" r="4" fill="#f3e2bd"/><circle cx="625" cy="162" r="4" fill="#f3e2bd"/>
  <circle cx="614" cy="176" r="4" fill="#f3e2bd"/><circle cx="626" cy="190" r="4" fill="#f3e2bd"/>
  <circle cx="617" cy="205" r="4" fill="#f3e2bd"/><circle cx="625" cy="218" r="4" fill="#f3e2bd"/>
  <text x="760" y="150" font-size="11" text-anchor="middle">оболочка:</text>
  <text x="760" y="168" font-size="11" text-anchor="middle">ячеистая текстура</text>
  <text x="760" y="196" font-size="11" text-anchor="middle">5–30 яиц</text>
  <text x="760" y="224" font-size="11" text-anchor="middle">глубина 3–8 см</text>
  <!-- карта очагов -->
  <rect x="540" y="290" width="280" height="170" fill="#ffffff" stroke="#33475b" stroke-width="1"/>
  <text x="680" y="314" text-anchor="middle" font-weight="bold" font-size="12">Карта плотности кладок</text>
  <circle cx="585" cy="350" r="7" fill="#0a7d3c"/><text x="600" y="354" font-size="11">фоновая: до 2 на пробу</text>
  <circle cx="585" cy="380" r="7" fill="#f0a13c"/><text x="600" y="384" font-size="11">угрожающая: 2–8</text>
  <circle cx="585" cy="410" r="7" fill="#e05c5c"/><text x="600" y="414" font-size="11">критическая: более 8</text>
  <text x="680" y="442" text-anchor="middle" font-size="11">40 секунд на пробу, 12 га в смену</text>
  <!-- стрелка результата -->
  <rect x="90" y="400" width="410" height="60" fill="#eef4ee" stroke="#0a7d3c" stroke-width="1.5"/>
  <text x="295" y="426" text-anchor="middle" font-size="12">Выход: карта очагов для точечных мер в плавневой зоне</text>
  <text x="295" y="446" text-anchor="middle" font-size="11">механическое разрушение кладок вместо запрещённой химии</text>
</svg>
