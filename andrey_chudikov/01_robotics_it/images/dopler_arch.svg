<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="Arial" font-size="13">
  <rect width="860" height="520" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold">Арочный модуль ДОПЛЕР-СТАДО: зоны радиолокационного контроля</text>
  <!-- арка -->
  <rect x="120" y="80" width="36" height="330" fill="#dfe7ee" stroke="#33475b" stroke-width="2"/>
  <rect x="404" y="80" width="36" height="330" fill="#dfe7ee" stroke="#33475b" stroke-width="2"/>
  <rect x="120" y="60" width="320" height="34" fill="#c9d6e2" stroke="#33475b" stroke-width="2"/>
  <text x="280" y="82" text-anchor="middle" font-size="12">Блок обработки 24 В, 9 Вт</text>
  <!-- радары -->
  <rect x="150" y="210" width="12" height="26" fill="#e05c5c"/>
  <rect x="398" y="210" width="12" height="26" fill="#e05c5c"/>
  <text x="70" y="222" font-size="11">Радар 24 ГГц</text>
  <line x1="118" y1="222" x2="150" y2="222" stroke="#e05c5c" stroke-width="1.5" marker-end="none"/>
  <!-- зоны контроля -->
  <ellipse cx="280" cy="300" rx="128" ry="86" fill="none" stroke="#2b7de9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <ellipse cx="280" cy="300" rx="86" ry="52" fill="none" stroke="#2b7de9" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="280" y="404" text-anchor="middle" fill="#2b7de9" font-size="12">Зона анализа сигнатуры прохода (0,75 м по дальности)</text>
  <!-- корова -->
  <ellipse cx="280" cy="292" rx="66" ry="30" fill="#f2e3c8" stroke="#7a5c2e" stroke-width="1.5"/>
  <circle cx="348" cy="280" r="15" fill="#f2e3c8" stroke="#7a5c2e" stroke-width="1.5"/>
  <line x1="240" y1="320" x2="240" y2="368" stroke="#7a5c2e" stroke-width="3"/>
  <line x1="268" y1="322" x2="268" y2="370" stroke="#7a5c2e" stroke-width="3"/>
  <line x1="300" y1="322" x2="300" y2="370" stroke="#7a5c2e" stroke-width="3"/>
  <line x1="326" y1="318" x2="326" y2="364" stroke="#7a5c2e" stroke-width="3"/>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#7a5c2e">Животное без меток и датчиков</text>
  <!-- направление движения -->
  <line x1="180" y1="440" x2="380" y2="440" stroke="#33475b" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#33475b"/>
    </marker>
  </defs>
  <text x="280" y="462" text-anchor="middle" font-size="12">Направление движения: выход из доильного зала</text>
  <!-- сигнатура -->
  <polyline points="500,210 520,180 540,225 560,175 580,235 600,170 620,230 640,178 660,224 680,185 700,215" fill="none" stroke="#0a7d3c" stroke-width="2"/>
  <polyline points="500,300 520,282 540,308 560,278 580,318 600,286 620,306 640,284 660,312 680,290 700,302" fill="none" stroke="#e05c5c" stroke-width="2"/>
  <text x="600" y="160" text-anchor="middle" font-size="12">Спектрограмма прохода</text>
  <text x="600" y="248" fill="#0a7d3c" font-size="11">норма: периодичность шага симметрична</text>
  <text x="600" y="336" fill="#e05c5c" font-size="11">хромота: асимметрия компонент сигнатуры</text>
  <rect x="490" y="356" width="320" height="86" fill="#f5f8fb" stroke="#33475b" stroke-width="1"/>
  <text x="500" y="378" font-size="12" font-weight="bold">Выход системы за проход:</text>
  <text x="500" y="398" font-size="12">класс локомоции (норма/подозрение),</text>
  <text x="500" y="416" font-size="12">фаза жвачки, идентификатор по стойлу,</text>
  <text x="500" y="434" font-size="12">метка времени, запись в АСУ фермы</text>
</svg>
