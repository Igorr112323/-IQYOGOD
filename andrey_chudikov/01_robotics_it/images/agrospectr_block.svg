<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="430" y="24" text-anchor="middle" font-size="15" font-weight="bold">АГРОСПЕКТР-К: съёмочная штанга и каналы (вид сзади, в работе)</text>
  <!-- трактор -->
  <rect x="380" y="60" width="100" height="46" rx="8" fill="#cfd8dc" stroke="#37474f"/>
  <text x="430" y="88" text-anchor="middle">трактор 1,4</text>
  <rect x="415" y="106" width="30" height="18" fill="#90a4ae"/>
  <!-- штанга -->
  <line x1="90" y1="150" x2="770" y2="150" stroke="#37474f" stroke-width="6"/>
  <text x="430" y="140" text-anchor="middle">штанга 4,0 м, высота над посевами 0,9–1,2 м</text>
  <!-- камерные блоки -->
  <g stroke="#15417d" fill="#e3f2fd">
    <rect x="150" y="160" width="70" height="40" rx="4"/>
    <rect x="320" y="160" width="70" height="40" rx="4"/>
    <rect x="470" y="160" width="70" height="40" rx="4"/>
    <rect x="640" y="160" width="70" height="40" rx="4"/>
  </g>
  <text x="185" y="185" text-anchor="middle">RGB 12 Мп</text>
  <text x="355" y="185" text-anchor="middle">550 нм</text>
  <text x="505" y="185" text-anchor="middle">680/760 нм</text>
  <text x="675" y="185" text-anchor="middle">850 нм</text>
  <!-- конусы зрения -->
  <g fill="#bbdefb" opacity="0.5">
    <polygon points="160,200 210,200 240,300 130,300"/>
    <polygon points="330,200 380,200 410,300 300,300"/>
    <polygon points="480,200 530,200 560,300 450,300"/>
    <polygon points="650,200 700,200 730,300 620,300"/>
  </g>
  <rect x="80" y="300" width="700" height="14" fill="#7cb342"/>
  <text x="430" y="330" text-anchor="middle">посев озимой пшеницы; перекрытие кадра 1,8 мм/пикс, сетка анализа 0,5×0,5 м</text>
  <!-- вычислитель -->
  <rect x="330" y="350" width="200" height="44" rx="6" fill="#fff3e0" stroke="#e65100"/>
  <text x="430" y="369" text-anchor="middle">Jetson Orin Nano + STM32</text>
  <text x="430" y="385" text-anchor="middle">GNSS 2 см, LTE/LoRa</text>
  <line x1="430" y1="200" x2="430" y2="350" stroke="#e65100" stroke-dasharray="4 3"/>
</svg>
