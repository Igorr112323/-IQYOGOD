<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="430" y="24" text-anchor="middle" font-size="15" font-weight="bold">ЛАМЕКО-СКАН: арочный модуль на маршруте коровы (вид сбоку)</text>
  <!-- пол -->
  <rect x="40" y="350" width="780" height="22" fill="#cfd8dc" stroke="#546e7a"/>
  <text x="46" y="366">бетонный пол доильного маршрута</text>
  <!-- арка -->
  <rect x="150" y="90" width="16" height="260" fill="#78909c" stroke="#37474f"/>
  <rect x="560" y="90" width="16" height="260" fill="#78909c" stroke="#37474f"/>
  <rect x="150" y="78" width="426" height="18" fill="#90a4ae" stroke="#37474f"/>
  <!-- камеры -->
  <rect x="240" y="96" width="46" height="26" rx="4" fill="#1a237e" stroke="#0d47a1"/>
  <text x="230" y="140" fill="#0d47a1">камера 25 кадр/с</text>
  <rect x="430" y="96" width="46" height="26" rx="4" fill="#b71c1c" stroke="#7f0000"/>
  <text x="410" y="140" fill="#7f0000">тепловизор 9 Гц</text>
  <!-- корова -->
  <ellipse cx="360" cy="280" rx="95" ry="52" fill="#efebe9" stroke="#5d4037" stroke-width="2"/>
  <rect x="300" y="320" width="12" height="34" fill="#efebe9" stroke="#5d4037"/>
  <rect x="345" y="320" width="12" height="34" fill="#efebe9" stroke="#5d4037"/>
  <rect x="390" y="320" width="12" height="34" fill="#efebe9" stroke="#5d4037"/>
  <circle cx="470" cy="255" r="26" fill="#efebe9" stroke="#5d4037" stroke-width="2"/>
  <text x="330" y="250" fill="#5d4037">корова, проход 2–4 раза/сут</text>
  <!-- зона съёмки -->
  <line x1="263" y1="122" x2="330" y2="230" stroke="#0d47a1" stroke-dasharray="4 3"/>
  <line x1="453" y1="122" x2="390" y2="230" stroke="#7f0000" stroke-dasharray="4 3"/>
  <!-- вычислитель -->
  <rect x="620" y="180" width="180" height="120" rx="8" fill="#e8eaf6" stroke="#4527a0"/>
  <text x="710" y="204" text-anchor="middle" font-weight="bold">вычислительный блок</text>
  <text x="632" y="226">· трекинг животного</text>
  <text x="632" y="244">· признаки походки</text>
  <text x="632" y="262">· термоасимметрия копыт</text>
  <text x="632" y="280">· класс: норма/риск/осмотр</text>
  <line x1="576" y1="105" x2="620" y2="200" stroke="#4527a0" stroke-width="1.5"/>
  <text x="596" y="320" fill="#4527a0">→ личный кабинет фермы</text>
</svg>
