<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" font-size="15" font-weight="bold">КАРБОКУБАНЬ: пиролизный модуль 300 кг/ч (принципиальная схема)</text>
  <!-- бункер -->
  <polygon points="60,90 160,90 140,150 80,150" fill="#d7ccc8" stroke="#5d4037"/>
  <text x="110" y="80" text-anchor="middle">лузга, бункер 4 м³</text>
  <rect x="95" y="150" width="30" height="40" fill="#5d4037"/>
  <!-- сушилка -->
  <rect x="180" y="120" width="160" height="80" rx="8" fill="#ffe0b2" stroke="#e65100"/>
  <text x="260" y="150" text-anchor="middle">сушильная камера</text>
  <text x="260" y="168" text-anchor="middle">влажность 12% → 5%</text>
  <line x1="125" y1="170" x2="180" y2="160" stroke="#5d4037" stroke-width="3"/>
  <!-- реактор -->
  <rect x="400" y="110" width="200" height="100" rx="14" fill="#ffcdd2" stroke="#b71c1c" stroke-width="2"/>
  <text x="500" y="140" text-anchor="middle">реактор шнековый</text>
  <text x="500" y="158" text-anchor="middle">500 ± 30 °С, 45 мин</text>
  <text x="500" y="176" text-anchor="middle">сталь 10Х23Н18, 2,2 кВт</text>
  <line x1="340" y1="160" x2="400" y2="160" stroke="#e65100" stroke-width="3"/>
  <!-- термопары -->
  <g fill="#37474f">
    <circle cx="420" cy="110" r="4"/><circle cx="500" cy="110" r="4"/><circle cx="580" cy="110" r="4"/>
  </g>
  <text x="500" y="100" text-anchor="middle">3 × ТХА + ПИД (Шершнев И.А.)</text>
  <!-- уголь -->
  <line x1="600" y1="160" x2="660" y2="160" stroke="#212121" stroke-width="4"/>
  <rect x="660" y="130" width="160" height="60" rx="8" fill="#eceff1" stroke="#212121"/>
  <text x="740" y="152" text-anchor="middle">биоуголь 101 кг/ч</text>
  <text x="740" y="170" text-anchor="middle">C 78,2% · БЭТ 214 м²/г</text>
  <!-- газ -->
  <line x1="500" y1="210" x2="500" y2="250" stroke="#7e57c2" stroke-width="3"/>
  <rect x="410" y="250" width="180" height="46" rx="8" fill="#ede7f6" stroke="#7e57c2"/>
  <text x="500" y="270" text-anchor="middle">пиролизный газ</text>
  <text x="500" y="286" text-anchor="middle">60% → сушилка · 40% → дожигание</text>
  <line x1="410" y1="273" x2="260" y2="200" stroke="#7e57c2" stroke-width="2" stroke-dasharray="5 3"/>
  <!-- жидкая фракция -->
  <line x1="460" y1="210" x2="300" y2="330" stroke="#26a69a" stroke-width="3"/>
  <rect x="220" y="330" width="160" height="44" rx="8" fill="#e0f2f1" stroke="#26a69a"/>
  <text x="300" y="348" text-anchor="middle">жидкая фракция</text>
  <text x="300" y="364" text-anchor="middle">компонент биопрепаратов</text>
  <!-- датчик CO -->
  <rect x="660" y="250" width="160" height="46" rx="8" fill="#fff9c4" stroke="#f9a825"/>
  <text x="740" y="270" text-anchor="middle">датчик CO + аварийная</text>
  <text x="740" y="286" text-anchor="middle">продувка N₂</text>
  <text x="440" y="420" text-anchor="middle" fill="#555">Макет подтвердил 310 кг/ч; себестоимость модуля 712 тыс. руб.; удельные нужды 0,11 кВт·ч/кг сырья.</text>
</svg>
