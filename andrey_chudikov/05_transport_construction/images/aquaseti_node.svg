<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="bold">АКУСТИК-СЕТИ: акустический узел (разрез, масштаб 2:1)</text>
  <!-- шток задвижки -->
  <rect x="356" y="60" width="24" height="120" fill="#78909c" stroke="#37474f"/>
  <rect x="330" y="54" width="76" height="14" rx="4" fill="#546e7a"/>
  <text x="440" y="110">шток задвижки Ду300</text>
  <!-- волновод -->
  <rect x="360" y="180" width="16" height="40" fill="#b0bec5" stroke="#37474f"/>
  <text x="440" y="200">стальной волновод</text>
  <!-- пьезо -->
  <circle cx="368" cy="238" r="17" fill="#ffe082" stroke="#f57f17"/>
  <text x="440" y="242">пьезодиск 27 мм</text>
  <!-- плата -->
  <rect x="300" y="265" width="136" height="70" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="368" y="285" text-anchor="middle">усилитель 300–3000 Гц</text>
  <text x="368" y="301" text-anchor="middle">ESP32 + БПФ</text>
  <text x="368" y="317" text-anchor="middle">NB-IoT модем</text>
  <!-- батарея -->
  <rect x="300" y="345" width="136" height="34" rx="6" fill="#bbdefb" stroke="#1565c0"/>
  <text x="368" y="367" text-anchor="middle">LiSOCl₂ 19 А·ч, 26 мес</text>
  <!-- корпус -->
  <rect x="280" y="250" width="176" height="140" rx="14" fill="none" stroke="#37474f" stroke-width="2"/>
  <text x="440" y="330">корпус АБС, IP67</text>
  <!-- антенна -->
  <line x1="368" y1="250" x2="368" y2="120" stroke="#e65100" stroke-width="2"/>
  <text x="250" y="140">антенна 900 МГц</text>
  <!-- магнитное основание -->
  <rect x="320" y="396" width="96" height="16" fill="#616161"/>
  <text x="440" y="408">магнитное основание 35 кгс</text>
  <text x="380" y="450" text-anchor="middle" fill="#555">Себестоимость макета 8 900 руб.; потребление в покое 8,4 мкА; расчётная автономность 26 мес.</text>
</svg>
