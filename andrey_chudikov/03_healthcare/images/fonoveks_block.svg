<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="430" y="24" text-anchor="middle" font-size="15" font-weight="bold">ФОНО-ВЕКС: структурная схема платформы</text>
  <!-- участник -->
  <rect x="40" y="150" width="180" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="130" y="176" text-anchor="middle" font-weight="bold">Участник 65+</text>
  <text x="130" y="198" text-anchor="middle">обычный телефон,</text>
  <text x="130" y="214" text-anchor="middle">без приложений</text>
  <text x="130" y="238" text-anchor="middle" fill="#1b5e20">1 звонок / 2 недели</text>
  <!-- SIP -->
  <rect x="270" y="150" width="150" height="110" rx="10" fill="#e3f2fd" stroke="#0d47a1"/>
  <text x="345" y="176" text-anchor="middle" font-weight="bold">Телефонный контур</text>
  <text x="345" y="198" text-anchor="middle">SIP-шлюз, запись,</text>
  <text x="345" y="214" text-anchor="middle">контроль SNR 94%</text>
  <!-- анализ -->
  <rect x="470" y="150" width="170" height="110" rx="10" fill="#ede7f6" stroke="#4527a0"/>
  <text x="555" y="176" text-anchor="middle" font-weight="bold">Анализ</text>
  <text x="555" y="198" text-anchor="middle">просодия: темп, паузы,</text>
  <text x="555" y="214" text-anchor="middle">тон, энергия голоса</text>
  <text x="555" y="236" text-anchor="middle">калибровка: речь 65+ Кубани</text>
  <!-- триаж -->
  <rect x="690" y="120" width="140" height="60" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="760" y="145" text-anchor="middle">Триаж</text>
  <text x="760" y="163" text-anchor="middle">план / 2 нед / срочно</text>
  <rect x="690" y="200" width="140" height="60" rx="8" fill="#fce4ec" stroke="#c2185b"/>
  <text x="760" y="225" text-anchor="middle">Фельдшер /</text>
  <text x="760" y="243" text-anchor="middle">телемедицина ЦРБ</text>
  <!-- связи -->
  <line x1="220" y1="205" x2="270" y2="205" stroke="#455a64" stroke-width="2"/>
  <line x1="420" y1="205" x2="470" y2="205" stroke="#455a64" stroke-width="2"/>
  <line x1="640" y1="180" x2="690" y2="150" stroke="#455a64" stroke-width="2"/>
  <line x1="640" y1="230" x2="690" y2="230" stroke="#455a64" stroke-width="2"/>
  <!-- датасет -->
  <rect x="270" y="300" width="370" height="80" rx="10" fill="#eceff1" stroke="#546e7a"/>
  <text x="455" y="326" text-anchor="middle" font-weight="bold">Датасет и валидация (протокол 06–08.2026)</text>
  <text x="455" y="348" text-anchor="middle">412 участников · 1 236 диалогов · эталон GDS-15</text>
  <text x="455" y="366" text-anchor="middle">чувствительность 0,86 · специфичность 0,79 · 11 340 звонков</text>
  <line x1="455" y1="260" x2="455" y2="300" stroke="#546e7a" stroke-dasharray="4 3"/>
</svg>
