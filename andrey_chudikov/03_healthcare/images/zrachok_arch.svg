<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="Arial" font-size="13">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold">Насадка-упор ЗРАЧОК-ВЕКС и зоны измерения</text>
  <!-- голова -->
  <circle cx="150" cy="240" r="70" fill="#f6e7d6" stroke="#8a6a4a" stroke-width="2"/>
  <circle cx="170" cy="220" r="16" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="170" cy="220" r="6" fill="#222"/>
  <text x="150" y="340" text-anchor="middle" font-size="12">Пациент</text>
  <!-- насадка -->
  <rect x="250" y="180" width="130" height="60" rx="10" fill="#dfe7ee" stroke="#33475b" stroke-width="2"/>
  <text x="315" y="205" text-anchor="middle" font-size="11">Насадка-упор</text>
  <text x="315" y="222" text-anchor="middle" font-size="11">30 ± 2 мм</text>
  <circle cx="380" cy="200" r="6" fill="#a33" opacity="0.6"/>
  <text x="392" y="204" font-size="10">ИК 850 нм</text>
  <circle cx="380" cy="225" r="5" fill="#ffd23f"/>
  <text x="392" y="229" font-size="10">Калиброванный стимул</text>
  <!-- смартфон -->
  <rect x="440" y="170" width="70" height="130" rx="12" fill="#33475b" stroke="#1d2a36" stroke-width="2"/>
  <rect x="448" y="182" width="54" height="90" rx="4" fill="#cfe3f5"/>
  <circle cx="475" cy="285" r="5" fill="#cfe3f5"/>
  <text x="475" y="320" text-anchor="middle" font-size="12">Смартфон 60 к/с</text>
  <line x1="186" y1="220" x2="250" y2="210" stroke="#8a6a4a" stroke-width="1.5"/>
  <line x1="380" y1="210" x2="440" y2="210" stroke="#33475b" stroke-width="1.5"/>
  <!-- кривая диаметра -->
  <polyline points="560,180 590,180 600,182 608,240 620,252 640,252 660,248 680,220 700,196 720,188 740,186" fill="none" stroke="#0a7d3c" stroke-width="2.5"/>
  <polyline points="560,270 590,270 600,276 608,300 620,306 640,306 660,304 680,296 700,288 720,284 740,283" fill="none" stroke="#e05c5c" stroke-width="2.5"/>
  <text x="650" y="160" text-anchor="middle" font-size="12">Диаметр зрачка, мм (время →)</text>
  <text x="650" y="268" fill="#0a7d3c" font-size="11">норма: быстрое сужение и восстановление</text>
  <text x="650" y="324" fill="#e05c5c" font-size="11">снижение: замедленная реакция, малая амплитуда</text>
  <!-- маршрут -->
  <rect x="560" y="350" width="250" height="110" fill="#f5f8fb" stroke="#33475b" stroke-width="1"/>
  <text x="685" y="372" text-anchor="middle" font-weight="bold" font-size="12">Выход: категория риска</text>
  <text x="570" y="394" font-size="12">норма — график диспансеризации</text>
  <text x="570" y="414" font-size="12">умеренное — повтор через 6 мес</text>
  <text x="570" y="434" font-size="12">высокий риск — невролог + телеплечо</text>
  <text x="570" y="454" font-size="11" fill="#666">запись в МИС по защищённому каналу</text>
</svg>
