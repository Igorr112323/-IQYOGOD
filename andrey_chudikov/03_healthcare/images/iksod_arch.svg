<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="Arial" font-size="13">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold">ИКСОД-НАДЗОР: устройство ловушки и морфометрические признаки</text>
  <!-- опора и корпус -->
  <rect x="140" y="330" width="12" height="120" fill="#33475b"/>
  <rect x="90" y="180" width="110" height="150" rx="10" fill="#dfe7ee" stroke="#33475b" stroke-width="2"/>
  <rect x="102" y="196" width="86" height="20" rx="4" fill="#8fa5ba"/>
  <text x="145" y="172" text-anchor="middle" font-size="11">дозатор CO2</text>
  <rect x="102" y="228" width="86" height="60" rx="4" fill="#efe6d8" stroke="#33475b" stroke-width="1.5"/>
  <text x="145" y="262" text-anchor="middle" font-size="10">клеевой планшет</text>
  <rect x="102" y="296" width="86" height="22" rx="4" fill="#2b7de9" opacity="0.7"/>
  <text x="145" y="311" text-anchor="middle" font-size="10" fill="#fff">макромодуль 20 Мп</text>
  <!-- клещ крупно -->
  <rect x="270" y="90" width="260" height="200" fill="#f5f8fb" stroke="#33475b" stroke-width="1"/>
  <text x="400" y="114" text-anchor="middle" font-weight="bold" font-size="13">Иксодовый клещ (датасет)</text>
  <ellipse cx="380" cy="200" rx="52" ry="44" fill="#8a5a3a" stroke="#4c2f1c" stroke-width="2"/>
  <ellipse cx="380" cy="176" rx="34" ry="18" fill="#a9714b" stroke="#4c2f1c" stroke-width="1.5"/>
  <rect x="372" y="140" width="16" height="22" fill="#4c2f1c"/>
  <text x="300" y="150" font-size="11">хоботок:</text>
  <text x="300" y="166" font-size="11">длина, форма</text>
  <text x="300" y="230" font-size="11">скутум:</text>
  <text x="300" y="246" font-size="11">пропорции, эмблемы</text>
  <!-- признаки -->
  <rect x="560" y="90" width="250" height="200" fill="#ffffff" stroke="#33475b" stroke-width="1"/>
  <text x="685" y="114" text-anchor="middle" font-weight="bold" font-size="12">24 морфометрических признака</text>
  <text x="575" y="140" font-size="11">• пропорции скутума и идосомы</text>
  <text x="575" y="162" font-size="11">• длина и форма хоботка</text>
  <text x="575" y="184" font-size="11">• рисунок эмблем и фестонов</text>
  <text x="575" y="206" font-size="11">• положение глаз и борозд</text>
  <text x="575" y="228" font-size="11">• соотношение длин ног I–IV</text>
  <text x="575" y="256" font-size="11" fill="#7c1f1f">Hyalomma — вес 2,5: переносчик КГЛ</text>
  <!-- веса и индекс -->
  <rect x="270" y="330" width="540" height="120" fill="#eef4ee" stroke="#0a7d3c" stroke-width="1.5"/>
  <text x="540" y="356" text-anchor="middle" font-weight="bold" font-size="12">Риск-индекс территории за сутки</text>
  <text x="540" y="382" text-anchor="middle" font-size="12">Σ (экземпляры × вес вида) / ловушко-сутки; веса: Ixodes 1,0 · Dermacentor 1,2 · Rhipicephalus 1,2 · Hyalomma 2,5</text>
  <text x="540" y="408" text-anchor="middle" font-size="12">порог превышен → оповещение служб и внеочередная обработка участка</text>
  <text x="540" y="432" text-anchor="middle" font-size="11">опережение контрольного флажения — медиана 48 часов</text>
</svg>
