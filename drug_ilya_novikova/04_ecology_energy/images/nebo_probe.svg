<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" font-size="15" font-weight="bold">Зонд «ЧИСТОЕ НЕБО» в теле полигона</text>
  <!-- тело полигона -->
  <path d="M40 360 L160 200 L300 150 L440 200 L560 360 Z" fill="#8d6e63" opacity="0.45"/>
  <path d="M40 360 L160 200 L300 150 L440 200 L560 360" fill="none" stroke="#5d4037" stroke-width="2"/>
  <text x="300" y="340" text-anchor="middle">тело полигона: массив отходов</text>
  <!-- очаг -->
  <circle cx="330" cy="270" r="34" fill="#ff7043" opacity="0.8"/>
  <text x="330" y="274" text-anchor="middle" fill="#fff" font-size="11">очаг тления</text>
  <!-- скважина с зондом -->
  <rect x="296" y="160" width="10" height="130" fill="#cfd8dc" stroke="#455a64"/>
  <rect x="294" y="240" width="14" height="40" rx="4" fill="#ffca28" stroke="#ef6c00" stroke-width="2"/>
  <text x="230" y="260" text-anchor="end">зонд: CO, CH4, T</text>
  <line x1="235" y1="256" x2="292" y2="256" stroke="#ef6c00" stroke-dasharray="3 3"/>
  <!-- панель -->
  <rect x="284" y="140" width="34" height="16" fill="#1565c0"/>
  <text x="360" y="152" font-size="10">солнечная панель</text>
  <!-- дым был бы позже -->
  <path d="M330 236 q-8 -18 4 -30 q10 -10 2 -24" stroke="#90a4ae" stroke-width="3" fill="none" opacity="0.6"/>
  <text x="392" y="196" font-size="11" fill="#607d8b">дым на поверхности — через 4–6 суток</text>
  <!-- сервер -->
  <rect x="620" y="120" width="230" height="140" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="735" y="150" text-anchor="middle" font-weight="bold">Сервер полигона</text>
  <text x="735" y="174" text-anchor="middle">модель очага: кластер 3+ зондов</text>
  <text x="735" y="192" text-anchor="middle">карта риска по зонам</text>
  <text x="735" y="210" text-anchor="middle">метан отдельно — взрывоопасность</text>
  <text x="735" y="228" text-anchor="middle">наряд пересыпки: срок — сутки</text>
  <path d="M560 300 L620 210" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <!-- дрон -->
  <rect x="620" y="290" width="230" height="70" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="735" y="316" text-anchor="middle" font-weight="bold">Дрон с тепловизором</text>
  <text x="735" y="338" text-anchor="middle">облёт по тревоге: подтверждение и снимки</text>
  <path d="M735 260 L735 290" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
