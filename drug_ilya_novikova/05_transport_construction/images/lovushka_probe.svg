<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" font-size="15" font-weight="bold">Датчик «ЛОВУШКА-0» под крышкой люка</text>
  <!-- дорога -->
  <rect x="60" y="90" width="480" height="40" fill="#616161"/>
  <text x="300" y="115" text-anchor="middle" fill="#fff">тротуар или магистраль</text>
  <!-- люк -->
  <circle cx="300" cy="130" r="46" fill="#455a64" stroke="#263238" stroke-width="3"/>
  <circle cx="300" cy="130" r="36" fill="none" stroke="#263238" stroke-width="1.5"/>
  <text x="300" y="134" text-anchor="middle" fill="#fff" font-size="11">крышка</text>
  <!-- датчик -->
  <rect x="282" y="185" width="36" height="26" rx="5" fill="#ffca28" stroke="#ef6c00" stroke-width="2"/>
  <line x1="300" y1="176" x2="300" y2="185" stroke="#455a64" stroke-width="3"/>
  <text x="370" y="200">датчик под обечайкой: установка 20 минут</text>
  <!-- камера люка -->
  <rect x="270" y="211" width="60" height="130" fill="#cfd8dc" stroke="#455a64"/>
  <rect x="270" y="290" width="60" height="51" fill="#4fc3f7" opacity="0.8"/>
  <text x="380" y="300">датчик уровня: вода в камере — авария внизу</text>
  <!-- сигналы -->
  <path d="M318 196 q70 -40 160 -60" stroke="#0d47a1" stroke-dasharray="5 4" fill="none"/>
  <rect x="580" y="90" width="260" height="150" rx="10" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="710" y="118" text-anchor="middle" font-weight="bold">Диспетчерская</text>
  <text x="710" y="142" text-anchor="middle">крышки нет / смещена / просела / вода</text>
  <text x="710" y="160" text-anchor="middle">наряд подрядчику с нормативом:</text>
  <text x="710" y="178" text-anchor="middle">тротуар — 6 ч, магистраль — 12 ч</text>
  <text x="710" y="196" text-anchor="middle">закрытие по фото и отметке датчика</text>
  <text x="710" y="214" text-anchor="middle">срыв срока виден администрации</text>
  <!-- карта -->
  <rect x="580" y="270" width="260" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="710" y="298" text-anchor="middle" font-weight="bold">Публичная карта</text>
  <text x="710" y="320" text-anchor="middle">статус каждой точки: обнаружено —</text>
  <text x="710" y="338" text-anchor="middle">наряд назначен — закрыто</text>
  <text x="710" y="356" text-anchor="middle">фото-заявки жителей</text>
  <path d="M710 240 L710 270" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <text x="300" y="380" text-anchor="middle">батарея 3 года · радиоканал · антивандальное крепление под обечайку</text>
</svg>
