<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" font-size="15" font-weight="bold">ДОСТУПНЫЙ КУРОРТ: платформа и слои карты</text>
  <!-- карта слева -->
  <rect x="40" y="60" width="420" height="330" rx="12" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="250" y="86" text-anchor="middle" font-weight="bold">Карта курорта (веб + мобильная версия)</text>
  <path d="M60 330 q90 -60 150 -40 q80 25 180 -30" stroke="#1565c0" stroke-width="3" fill="none"/>
  <text x="90" y="352" fill="#1565c0">маршрут «вокзал — пляж»</text>
  <circle cx="90" cy="300" r="9" fill="#2e7d32"/><text x="104" y="304">доступно (11)</text>
  <circle cx="190" cy="230" r="9" fill="#f9a825"/><text x="204" y="234">с помощью (15)</text>
  <circle cx="300" cy="180" r="9" fill="#c62828"/><text x="314" y="184">недоступно (14)</text>
  <rect x="60" y="110" width="180" height="60" rx="8" fill="#ffffff" stroke="#90a4ae"/>
  <text x="150" y="132" text-anchor="middle">карточка объекта:</text>
  <text x="150" y="150" text-anchor="middle">параметры, фото, статус</text>
  <!-- слои справа -->
  <rect x="500" y="60" width="340" height="100" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="670" y="84" text-anchor="middle" font-weight="bold">Слой 1: турист</text>
  <text x="515" y="106">планирование отдыха по честным статусам</text>
  <text x="515" y="124">маршруты, фильтры, офлайн-режим</text>
  <rect x="500" y="175" width="340" height="100" rx="10" fill="#fff8e1" stroke="#f9a825"/>
  <text x="670" y="199" text-anchor="middle" font-weight="bold">Слой 2: объект</text>
  <text x="515" y="221">аудит 42 параметров + паспорт доступности</text>
  <text x="515" y="239">38 тыс. руб./объект; рекомендации по адаптации</text>
  <rect x="500" y="290" width="340" height="100" rx="10" fill="#ede7f6" stroke="#4527a0"/>
  <text x="670" y="314" text-anchor="middle" font-weight="bold">Слой 3: муниципалитет</text>
  <text x="515" y="336">индекс доступности, план работ, отчётность</text>
  <text x="515" y="354">подписка 45 тыс. руб./мес; программа «Доступная среда»</text>
  <line x1="460" y1="110" x2="500" y2="110" stroke="#607d8b" stroke-width="2"/>
  <line x1="460" y1="225" x2="500" y2="225" stroke="#607d8b" stroke-width="2"/>
  <line x1="460" y1="340" x2="500" y2="340" stroke="#607d8b" stroke-width="2"/>
  <text x="440" y="418" text-anchor="middle" fill="#455a64">Пилот 2026 г.: Анапа, Геленджик, Ейск — 240 объектов, 40 полных аудитов, 6 маршрутов</text>
</svg>
