<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="840" height="440" fill="#ffffff"/>
  <text x="420" y="24" text-anchor="middle" font-size="15" font-weight="bold">ЭКОСИГНАЛ КУБАНИ: слои открытой карты района</text>
  <rect x="30" y="44" width="520" height="360" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="290" y="66" text-anchor="middle" font-weight="bold">карта района</text>
  <!-- свалки -->
  <g>
    <circle cx="120" cy="140" r="14" fill="#8d6e63"/>
    <circle cx="150" cy="170" r="10" fill="#8d6e63"/>
    <circle cx="340" cy="300" r="12" fill="#8d6e63"/>
  </g>
  <text x="200" y="130">свалки: кластер юго-запад</text>
  <!-- водоёмы -->
  <path d="M60 260 q 80 -30 160 0 q 80 30 160 0" fill="none" stroke="#29b6f6" stroke-width="6"/>
  <circle cx="220" cy="258" r="9" fill="#f57f17"/>
  <text x="300" y="240">водоём: сигнал о пятне, статус «в работе»</text>
  <!-- датчики -->
  <g fill="#7e57c2">
    <rect x="390" y="120" width="14" height="14" rx="3"/>
    <rect x="450" y="220" width="14" height="14" rx="3"/>
    <rect x="90" y="330" width="14" height="14" rx="3"/>
  </g>
  <text x="420" y="110">школьные посты датчиков</text>
  <!-- панель справа -->
  <rect x="580" y="44" width="230" height="170" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="695" y="68" text-anchor="middle" font-weight="bold">диспетчерская района</text>
  <text x="595" y="92">· кластеры сигналов</text>
  <text x="595" y="112">· авто-назначение исполнителя</text>
  <text x="595" y="132">· контроль сроков</text>
  <text x="595" y="152">· эскалация просрочек</text>
  <text x="595" y="172">· отчёт главе района</text>
  <rect x="580" y="230" width="230" height="170" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="695" y="254" text-anchor="middle" font-weight="bold">публичный индекс района</text>
  <text x="595" y="278">· доля решённых сигналов: 63 %</text>
  <text x="595" y="298">· срок реакции: 19 → 7 дней</text>
  <text x="595" y="318">· данные постов воздуха</text>
  <text x="595" y="338">· рейтинг среди районов, ежеквартально</text>
  <text x="595" y="362" font-style="italic">«ничто так не дисциплинирует,</text>
  <text x="595" y="378" font-style="italic">как сравнение с соседями»</text>
</svg>
