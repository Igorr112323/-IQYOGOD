<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" font-size="15" font-weight="bold">Пост «ЖИВОЙ БЕРЕГ» на участке без спасателя</text>
  <!-- море и берег -->
  <rect x="40" y="300" width="440" height="90" fill="#4fc3f7" opacity="0.7"/>
  <rect x="40" y="270" width="440" height="30" fill="#ffe082"/>
  <text x="260" y="290" text-anchor="middle">берег</text>
  <!-- тонущий -->
  <circle cx="330" cy="340" r="8" fill="#b71c1c"/>
  <path d="M322 348 q8 8 16 0" stroke="#b71c1c" stroke-width="2" fill="none"/>
  <text x="330" y="378" text-anchor="middle" fill="#b71c1c">тонущий: вертикально, без продвижения</text>
  <!-- опора поста -->
  <rect x="140" y="110" width="8" height="160" fill="#78909c"/>
  <rect x="100" y="80" width="90" height="40" rx="8" fill="#ffca28" stroke="#ef6c00" stroke-width="2"/>
  <text x="145" y="104" text-anchor="middle" font-size="11">пост</text>
  <circle cx="118" cy="95" r="8" fill="#37474f"/>
  <text x="118" y="70" text-anchor="middle" font-size="10">камера</text>
  <!-- катапульта и круг -->
  <rect x="170" y="86" width="26" height="28" fill="#ef6c00"/>
  <path d="M196 96 q80 60 128 232" stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <circle cx="326" cy="322" r="12" fill="none" stroke="#d32f2f" stroke-width="6"/>
  <line x1="330" y1="340" x2="326" y2="330" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="240" y="230" fill="#ef6c00">круг летит 20–40 секунд</text>
  <!-- панель -->
  <rect x="540" y="90" width="300" height="150" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="690" y="120" text-anchor="middle" font-weight="bold">Что видит модель</text>
  <text x="690" y="144" text-anchor="middle">вертикальная поза без движения ногами</text>
  <text x="690" y="162" text-anchor="middle">запрокинутая голова, всплески без продвижения</text>
  <text x="690" y="180" text-anchor="middle">два кадра подряд — тревога</text>
  <text x="690" y="198" text-anchor="middle">обычное купание тревогу не поднимает</text>
  <path d="M190 96 L540 140" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <!-- авто -->
  <rect x="540" y="270" width="300" height="100" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="690" y="298" text-anchor="middle" font-weight="bold">Автономность поста</text>
  <text x="690" y="320" text-anchor="middle">солнечная панель 200 Вт · батарея 3 суток</text>
  <text x="690" y="338" text-anchor="middle">запас 4 круга · одна опора, без капстроительства</text>
  <text x="690" y="356" text-anchor="middle">медиана до круга 31 с против 10–15 минут</text>
</svg>
