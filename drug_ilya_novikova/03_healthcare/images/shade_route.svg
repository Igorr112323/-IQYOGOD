<svg xmlns="http://www.w3.org/2000/svg" width="840" height="450" viewBox="0 0 840 450" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="840" height="450" fill="#ffffff"/>
  <text x="420" y="24" text-anchor="middle" font-size="15" font-weight="bold">ТЕНЬ КУБАНИ: теневые маршруты к школе № 83 (схема района)</text>
  <!-- кварталы -->
  <g fill="#eceff1" stroke="#90a4ae">
    <rect x="60" y="60" width="180" height="120"/>
    <rect x="300" y="60" width="180" height="120"/>
    <rect x="540" y="60" width="180" height="120"/>
    <rect x="60" y="240" width="180" height="140"/>
    <rect x="540" y="240" width="180" height="140"/>
  </g>
  <!-- площадь -->
  <rect x="300" y="240" width="180" height="140" fill="#ffccbc" stroke="#bf360c"/>
  <text x="390" y="310" text-anchor="middle">асфальтовая площадь</text>
  <text x="390" y="328" text-anchor="middle">поверхность до +61 °С</text>
  <!-- старый маршрут -->
  <polyline points="150,370 300,370 390,310 390,240 390,180" fill="none" stroke="#b71c1c" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="240" y="398" fill="#b71c1c">старый маршрут: тень 22 %</text>
  <!-- теневой маршрут -->
  <polyline points="150,370 150,240 240,240 240,180 300,180 390,180" fill="none" stroke="#2e7d32" stroke-width="4"/>
  <text x="150" y="220" fill="#2e7d32">теневой маршрут: тень 58 %</text>
  <!-- деревья -->
  <g fill="#66bb6a">
    <circle cx="240" cy="210" r="9"/><circle cx="240" cy="255" r="9"/><circle cx="240" cy="300" r="9"/>
    <circle cx="300" cy="160" r="9"/><circle cx="340" cy="160" r="9"/>
  </g>
  <text x="120" y="330"> существующие деревья</text>
  <!-- школа и питьевая точка -->
  <rect x="360" y="150" width="70" height="34" fill="#fff9c4" stroke="#f9a825"/>
  <text x="395" y="172" text-anchor="middle">школа</text>
  <circle cx="470" cy="230" r="7" fill="#29b6f6"/>
  <text x="480" y="234">питьевая точка: 1 240 использований за июль</text>
  <!-- легенда -->
  <rect x="560" y="300" width="220" height="80" rx="8" fill="#f5f5f5" stroke="#616161"/>
  <text x="572" y="322">· жаровая нагрузка на ребёнка</text>
  <text x="572" y="340">  −18…−24 % (по индексу проекта)</text>
  <text x="572" y="358">· удлинение пути всего 200–300 м</text>
  <text x="572" y="376" font-style="italic">· дерево на карте = профилактика на 40 лет</text>
</svg>
