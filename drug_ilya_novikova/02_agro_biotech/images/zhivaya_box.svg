<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="820" height="440" fill="#ffffff"/>
  <text x="410" y="24" text-anchor="middle" font-size="15" font-weight="bold">ЖИВАЯ ЗЕМЛЯ: вермикомпостер (разрез)</text>
  <!-- навес -->
  <polygon points="120,70 420,50 420,66 120,86" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="270" y="40" text-anchor="middle">теневой навес с вентиляцией</text>
  <!-- корпус -->
  <rect x="150" y="110" width="240" height="220" rx="10" fill="#efebe9" stroke="#5d4037" stroke-width="3"/>
  <rect x="165" y="125" width="210" height="80" rx="6" fill="#fff3e0" stroke="#e65100"/>
  <text x="270" y="155" text-anchor="middle">приёмная камера: органика + картон/лист</text>
  <text x="270" y="173" text-anchor="middle">закладка 15 мин/нед</text>
  <rect x="165" y="215" width="210" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="270" y="245" text-anchor="middle">камера дозревания, 60–90 дней</text>
  <text x="270" y="263" text-anchor="middle">E. fetida 18–24 тыс/м³</text>
  <rect x="165" y="303" width="210" height="18" fill="#d7ccc8" stroke="#5d4037"/>
  <text x="270" y="317" text-anchor="middle">поддон вермичая</text>
  <!-- утепление -->
  <rect x="140" y="100" width="10" height="240" fill="#bcaaa4"/>
  <rect x="390" y="100" width="10" height="240" fill="#bcaaa4"/>
  <text x="430" y="200">двойные стенки + утеплитель</text>
  <text x="430" y="218">внутри +8…+28 °С круглый год</text>
  <!-- датчик -->
  <rect x="330" y="86" width="44" height="20" rx="5" fill="#fff59d" stroke="#f57f17"/>
  <text x="430" y="100">датчик температуры -> журнал сети</text>
  <!-- итоги справа -->
  <rect x="500" y="120" width="280" height="210" rx="10" fill="#f1f8e9" stroke="#33691e"/>
  <text x="640" y="148" text-anchor="middle" font-weight="bold">результаты пилота (6 мес)</text>
  <text x="520" y="176">· органики переработано: 1,42 т</text>
  <text x="520" y="198">· биогумуса получено: 380 кг</text>
  <text x="520" y="220">· зимовка при −7 °С: без потерь</text>
  <text x="520" y="242">· всхожесть газона: 89 % против 72 %</text>
  <text x="520" y="264">· жалобы на запах: 0</text>
  <text x="520" y="286">· курс прошли 96 учеников</text>
  <text x="520" y="312" font-style="italic">обслуживание — 15 минут в неделю</text>
  <text x="410" y="415" text-anchor="middle" fill="#555">Корпус из переработанного пластика; себестоимость 34 тыс. руб., окупаемость 14 месяцев.</text>
</svg>
