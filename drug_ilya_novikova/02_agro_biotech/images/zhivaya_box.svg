<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="24" text-anchor="middle" font-size="15" font-weight="bold">БИОФИЛЬТР-СТОК: типовая секция в разрезе (профиль)</text>
  <!-- корпус секции -->
  <rect x="80" y="150" width="420" height="180" fill="#efebe9" stroke="#5d4037" stroke-width="3"/>
  <!-- гидроизоляция -->
  <rect x="80" y="322" width="420" height="8" fill="#37474f"/>
  <text x="90" y="345">гидроизоляция плёночная</text>
  <!-- субстрат -->
  <rect x="92" y="230" width="396" height="90" fill="#d7ccc8" stroke="#8d6e63"/>
  <text x="290" y="285" text-anchor="middle">субстрат: песок + гравий 0,2–20 мм, глубина секции 0,5 м</text>
  <!-- вода -->
  <rect x="92" y="212" width="396" height="18" fill="#b3e5fc" opacity="0.8"/>
  <text x="290" y="226" text-anchor="middle" fill="#01579b">сток: самотёк, удержание 8–10 суток</text>
  <!-- растения -->
  <g stroke="#2e7d32" stroke-width="3" fill="none">
    <path d="M150 230 q-4 -70 -14 -110 M150 230 q2 -75 6 -120 M150 230 q8 -60 20 -100"/>
    <path d="M250 230 q-4 -70 -14 -110 M250 230 q2 -75 6 -120 M250 230 q8 -60 20 -100"/>
    <path d="M350 230 q-4 -70 -14 -110 M350 230 q2 -75 6 -120 M350 230 q8 -60 20 -100"/>
    <path d="M440 230 q-4 -70 -14 -110 M440 230 q2 -75 6 -120 M440 230 q8 -60 20 -100"/>
  </g>
  <!-- корни -->
  <g stroke="#8d6e63" stroke-width="2" fill="none">
    <path d="M150 230 q-8 30 -20 50 M150 230 q4 34 -2 60 M150 230 q12 26 24 44"/>
    <path d="M250 230 q-8 30 -20 50 M250 230 q4 34 -2 60 M250 230 q12 26 24 44"/>
    <path d="M350 230 q-8 30 -20 50 M350 230 q4 34 -2 60 M350 230 q12 26 24 44"/>
  </g>
  <text x="290" y="105" text-anchor="middle" fill="#1b5e20">тростник / рогоз: кислород в зону корней, плёнка микроорганизмов</text>
  <!-- вход и выход -->
  <line x1="40" y1="185" x2="92" y2="185" stroke="#0288d1" stroke-width="4"/>
  <text x="20" y="175" fill="#0288d1">вход</text>
  <line x1="488" y1="200" x2="560" y2="200" stroke="#00acc1" stroke-width="4"/>
  <text x="505" y="190" fill="#006064">выход</text>
  <!-- датчик -->
  <rect x="452" y="150" width="30" height="20" rx="4" fill="#fff59d" stroke="#f57f17"/>
  <text x="505" y="165">датчик уровня → журнал проб</text>
  <!-- итоги справа -->
  <rect x="560" y="220" width="280" height="160" rx="10" fill="#f1f8e9" stroke="#33691e"/>
  <text x="700" y="248" text-anchor="middle" font-weight="bold">пилот 24 м², сезон 2026 г.</text>
  <text x="580" y="276">· БПК₅: −82 %</text>
  <text x="580" y="298">· аммонийный азот: −76 %</text>
  <text x="580" y="320">· взвешенные вещества: −88 %</text>
  <text x="580" y="342">· монтаж секций: 5 дней, без техники</text>
  <text x="580" y="364">· модуль под ключ: 480 тыс. руб.</text>
</svg>
