<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="490" viewBox="0 0 860 490" font-family="Arial" font-size="13">
  <rect width="860" height="490" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold">Летковый датчик ПЫЛЬЦА-ВЕКС</text>
  <!-- улей -->
  <rect x="60" y="180" width="330" height="200" rx="10" fill="#fdf3e3" stroke="#b07a2e" stroke-width="2"/>
  <rect x="60" y="150" width="330" height="34" rx="8" fill="#f3d9a4" stroke="#b07a2e" stroke-width="2"/>
  <text x="225" y="172" text-anchor="middle" font-size="12">Улей</text>
  <!-- леток -->
  <rect x="200" y="340" width="90" height="26" rx="6" fill="#fff" stroke="#7a5c2e" stroke-width="2"/>
  <text x="245" y="357" text-anchor="middle" font-size="11">леток</text>
  <!-- датчик -->
  <rect x="180" y="280" width="130" height="44" rx="8" fill="#dfe7ee" stroke="#33475b" stroke-width="2"/>
  <text x="245" y="300" text-anchor="middle" font-size="11">УФ 365 нм + камера</text>
  <text x="245" y="316" text-anchor="middle" font-size="11">фильтр 420–560 нм</text>
  <line x1="245" y1="324" x2="245" y2="340" stroke="#7a4a8a" stroke-width="2" marker-end="url(#p)"/>
  <defs><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#7a4a8a"/></marker></defs>
  <!-- пчёлы -->
  <ellipse cx="150" cy="255" rx="9" ry="6" fill="#ffd23f" stroke="#7a5c2e" stroke-width="1.5"/>
  <ellipse cx="330" cy="250" rx="9" ry="6" fill="#ffd23f" stroke="#7a5c2e" stroke-width="1.5"/>
  <ellipse cx="300" cy="268" rx="9" ry="6" fill="#ffd23f" stroke="#7a5c2e" stroke-width="1.5"/>
  <!-- солнечная панель -->
  <rect x="70" y="120" width="120" height="20" fill="#2b7de9" opacity="0.55" stroke="#14549c" stroke-width="1"/>
  <text x="130" y="112" text-anchor="middle" font-size="11">солнечное питание, LoRaWAN/4G</text>
  <!-- спектр -->
  <polyline points="470,220 500,215 530,205 555,150 580,120 605,150 630,200 660,215 690,220 720,222" fill="none" stroke="#0a7d3c" stroke-width="2.5"/>
  <polyline points="470,260 500,255 530,250 555,235 580,230 605,238 630,252 660,258 690,262 720,263" fill="none" stroke="#e05c5c" stroke-width="2.5"/>
  <text x="595" y="105" text-anchor="middle" font-size="12">Флуоресценция пыльцы, 420–560 нм</text>
  <text x="595" y="288" fill="#0a7d3c" font-size="11">чистая пыльца</text>
  <text x="595" y="306" fill="#e05c5c" font-size="11">пестицидный стресс: профиль изменён</text>
  <!-- сигналы -->
  <rect x="470" y="330" width="340" height="120" fill="#f5f8fb" stroke="#33475b" stroke-width="1"/>
  <text x="640" y="352" text-anchor="middle" font-weight="bold" font-size="12">Сигналы пасечнику</text>
  <text x="490" y="374" font-size="12">фон чист — журнал облётов</text>
  <text x="490" y="394" font-size="12">внимание — изменённый спектр пыльцы</text>
  <text x="490" y="414" font-size="12">тревога — протокол с геолокацией за 22–31 ч</text>
  <text x="490" y="434" font-size="11" fill="#666">до видимого ослабления семьи</text>
</svg>
