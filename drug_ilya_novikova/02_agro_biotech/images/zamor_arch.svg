<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="Arial" font-size="13">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold">ЗАМОР-СТОП: пост и детекция предзаморного поведения</text>
  <!-- ночной пруд -->
  <rect x="60" y="90" width="440" height="250" fill="#1c2733"/>
  <rect x="60" y="240" width="440" height="100" fill="#22384a"/>
  <!-- рыба у поверхности -->
  <g fill="#9fb6c9">
    <ellipse cx="180" cy="245" rx="16" ry="6"/><circle cx="196" cy="241" r="4"/>
    <ellipse cx="300" cy="243" rx="16" ry="6"/><circle cx="316" cy="239" r="4"/>
    <ellipse cx="410" cy="246" rx="16" ry="6"/><circle cx="426" cy="242" r="4"/>
  </g>
  <text x="280" y="225" text-anchor="middle" font-size="11" fill="#ffd23f">рыба заглатывает воздух у поверхности — ИК-кадр</text>
  <!-- столб и камера -->
  <rect x="530" y="140" width="10" height="200" fill="#33475b"/>
  <rect x="505" y="110" width="60" height="34" rx="6" fill="#dfe7ee" stroke="#33475b" stroke-width="2"/>
  <text x="535" y="100" text-anchor="middle" font-size="11">ИК-камера 4 Мп, 850 нм</text>
  <rect x="510" y="152" width="50" height="12" fill="#2b7de9" opacity="0.7"/>
  <text x="535" y="182" text-anchor="middle" font-size="10">солнечная панель</text>
  <line x1="505" y1="128" x2="300" y2="240" stroke="#ffd23f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="380" y="170" font-size="11" fill="#ffd23f">зона обзора до 40 м</text>
  <!-- график частоты -->
  <rect x="580" y="110" width="230" height="150" fill="#f5f8fb" stroke="#33475b" stroke-width="1"/>
  <text x="695" y="134" text-anchor="middle" font-weight="bold" font-size="12">Эпизоды всплытий за ночь</text>
  <polyline points="600,230 630,226 660,228 690,220 720,190 750,150 780,120" fill="none" stroke="#e05c5c" stroke-width="2"/>
  <line x1="600" y1="176" x2="790" y2="176" stroke="#33475b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="795" y="172" font-size="10">порог</text>
  <text x="695" y="252" text-anchor="middle" font-size="10">рост ×3 за 40 минут → тревога</text>
  <!-- оповещение -->
  <rect x="580" y="290" width="230" height="120" fill="#eef4ee" stroke="#0a7d3c" stroke-width="1.5"/>
  <text x="695" y="316" text-anchor="middle" font-weight="bold" font-size="12">Тревога за 60 секунд</text>
  <text x="695" y="342" text-anchor="middle" font-size="11">владелец: аэрация, спуск воды</text>
  <text x="695" y="364" text-anchor="middle" font-size="11">ЕДДС: бригада</text>
  <text x="695" y="386" text-anchor="middle" font-size="11">рыбоохрана: фиксация</text>
  <!-- берег -->
  <rect x="60" y="360" width="440" height="30" fill="#efe6d8" stroke="#8a6a4a" stroke-width="1"/>
  <text x="280" y="380" text-anchor="middle" font-size="12">Берег городского пруда: пост не требует обслуживающего персонала</text>
  <text x="430" y="440" text-anchor="middle" font-size="12">Опережение замора: 4–8 часов; датасет 11 400 эпизодов; точность детекции 0,93</text>
</svg>
