<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="Arial" font-size="13">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold">ВОДА-РАДАР: интерферометрия вдоль трассы водовода</text>
  <!-- спутник -->
  <rect x="120" y="70" width="70" height="26" rx="6" fill="#2b7de9"/>
  <rect x="80" y="76" width="34" height="14" fill="#2b7de9" opacity="0.6"/>
  <rect x="196" y="76" width="34" height="14" fill="#2b7de9" opacity="0.6"/>
  <text x="155" y="60" text-anchor="middle" font-size="11">радарный спутник, ревисит 6–12 сут</text>
  <line x1="155" y1="96" x2="430" y2="230" stroke="#2b7de9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="155" y1="96" x2="380" y2="230" stroke="#2b7de9" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <!-- трасса водовода -->
  <path d="M 80 300 C 220 250 380 250 520 290 C 640 322 740 330 800 350" fill="none" stroke="#33475b" stroke-width="5"/>
  <text x="430" y="278" text-anchor="middle" font-size="11">ось магистрального водовода</text>
  <!-- ячейки скоростей -->
  <circle cx="200" cy="282" r="9" fill="#0a7d3c"/>
  <circle cx="300" cy="262" r="9" fill="#0a7d3c"/>
  <circle cx="400" cy="262" r="9" fill="#f0a13c"/>
  <circle cx="500" cy="288" r="11" fill="#e05c5c"/>
  <circle cx="600" cy="312" r="9" fill="#0a7d3c"/>
  <circle cx="700" cy="334" r="9" fill="#0a7d3c"/>
  <text x="500" y="252" text-anchor="middle" font-size="11" fill="#7c1f1f">аномалия 9–14 мм/год — приоритет</text>
  <!-- легенда -->
  <rect x="560" y="70" width="250" height="120" fill="#f5f8fb" stroke="#33475b" stroke-width="1"/>
  <text x="685" y="92" text-anchor="middle" font-weight="bold" font-size="12">Скорости оседания</text>
  <circle cx="585" cy="112" r="7" fill="#0a7d3c"/><text x="600" y="116" font-size="11">фон 2–4 мм/год</text>
  <circle cx="585" cy="138" r="7" fill="#f0a13c"/><text x="600" y="142" font-size="11">5–8 мм/год — наблюдение</text>
  <circle cx="585" cy="164" r="7" fill="#e05c5c"/><text x="600" y="168" font-size="11">&gt; 8 мм/год — приоритет ремонта</text>
  <!-- выход в управление -->
  <rect x="120" y="400" width="620" height="64" fill="#eef4ee" stroke="#0a7d3c" stroke-width="1.5"/>
  <text x="430" y="426" text-anchor="middle" font-size="12">Ежемесячный слой данных → диспетчерские; годовой отчёт → производственные программы концессионеров</text>
  <text x="430" y="448" text-anchor="middle" font-size="12">средства с аварийного ремонта → плановый ремонт приоритетных участков</text>
</svg>
