<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" font-size="15" font-weight="bold">Приёмочный комплект «КАПРЕМОНТ-КОНТРОЛЬ»</text>
  <!-- дом -->
  <rect x="70" y="140" width="240" height="220" fill="#ffcc80" stroke="#ef6c00" stroke-width="2"/>
  <polygon points="70,140 190,80 310,140" fill="#d84315" stroke="#bf360c" stroke-width="2"/>
  <g fill="#fff" stroke="#795548">
    <rect x="95" y="170" width="40" height="40"/><rect x="170" y="170" width="40" height="40"/><rect x="245" y="170" width="40" height="40"/>
    <rect x="95" y="240" width="40" height="40"/><rect x="170" y="240" width="40" height="40"/><rect x="245" y="240" width="40" height="40"/>
  </g>
  <text x="190" y="390" text-anchor="middle">дом: кровля, фасад, инженерные системы, лифты</text>
  <!-- приборы -->
  <rect x="380" y="100" width="180" height="280" rx="10" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="470" y="130" text-anchor="middle" font-weight="bold">Измерительный комплект</text>
  <text x="470" y="160" text-anchor="middle">лазерный дальномер</text>
  <text x="470" y="182" text-anchor="middle">толщиномер покрытий</text>
  <text x="470" y="204" text-anchor="middle">влагомер основания</text>
  <text x="470" y="226" text-anchor="middle">тепловизор</text>
  <text x="470" y="258" text-anchor="middle">планшет приёмщика:</text>
  <text x="470" y="276" text-anchor="middle">сверка с проектом и допуском</text>
  <text x="470" y="294" text-anchor="middle">геометка и время измерения</text>
  <text x="470" y="312" text-anchor="middle">отклонение блокирует подписание</text>
  <path d="M310 250 L380 240" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- платформа -->
  <rect x="620" y="100" width="220" height="130" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="730" y="128" text-anchor="middle" font-weight="bold">Журнал контракта</text>
  <text x="730" y="152" text-anchor="middle">фотоверификация чек-листов</text>
  <text x="730" y="170" text-anchor="middle">исполнение в контуре 615-ПП</text>
  <text x="730" y="188" text-anchor="middle">расчёты и споры: доказательство</text>
  <path d="M560 220 L620 170" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- гарантия -->
  <rect x="620" y="260" width="220" height="120" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="730" y="288" text-anchor="middle" font-weight="bold">Гарантийный реестр</text>
  <text x="730" y="312" text-anchor="middle">5 лет после приёмки</text>
  <text x="730" y="330" text-anchor="middle">обращение собственника —</text>
  <text x="730" y="348" text-anchor="middle">подрядчик и материалы приёмки</text>
  <path d="M730 230 L730 260" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <text x="440" y="410" text-anchor="middle">приёмка дома — 4 часа; 14,5 % предъявлений с отклонениями устранены до подписания акта</text>
</svg>
