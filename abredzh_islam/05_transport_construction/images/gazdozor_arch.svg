<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="Arial" font-size="13">
  <rect width="880" height="540" fill="#ffffff"/>
  <text x="440" y="26" text-anchor="middle" font-size="16" font-weight="bold">ГАЗ-ДОЗОР: датчик вентшахты и путь сигнала тревоги</text>
  <!-- дом -->
  <rect x="60" y="80" width="240" height="330" fill="#f5f8fb" stroke="#33475b" stroke-width="2"/>
  <text x="180" y="70" text-anchor="middle" font-size="12">Газифицированный МКД</text>
  <rect x="80" y="100" width="90" height="50" rx="4" fill="#dfe7ee" stroke="#33475b" stroke-width="1.2"/>
  <text x="125" y="130" text-anchor="middle" font-size="10">квартира: плита</text>
  <rect x="80" y="170" width="90" height="50" rx="4" fill="#dfe7ee" stroke="#33475b" stroke-width="1.2"/>
  <text x="125" y="200" text-anchor="middle" font-size="10">квартира: колонка</text>
  <rect x="80" y="240" width="90" height="50" rx="4" fill="#dfe7ee" stroke="#33475b" stroke-width="1.2"/>
  <text x="125" y="270" text-anchor="middle" font-size="10">квартира: шланг,</text>
  <rect x="80" y="310" width="90" height="50" rx="4" fill="#dfe7ee" stroke="#33475b" stroke-width="1.2"/>
  <text x="125" y="340" text-anchor="middle" font-size="10">квартира: штуцер</text>
  <!-- вентшахта -->
  <rect x="210" y="100" width="50" height="310" fill="#eaf3fb" stroke="#2b7de9" stroke-width="1.5"/>
  <text x="235" y="250" text-anchor="middle" font-size="10" transform="rotate(-90 235 250)">вентиляционная шахта стояка</text>
  <path d="M 170 125 h 40 M 170 195 h 40 M 170 265 h 40 M 170 335 h 40" stroke="#33475b" stroke-width="1.5" marker-end="url(#m)"/>
  <!-- датчик -->
  <rect x="195" y="52" width="80" height="30" rx="6" fill="#f0a13c" stroke="#33475b" stroke-width="1.5"/>
  <text x="235" y="46" text-anchor="middle" font-size="11">датчик 1 653 нм</text>
  <path d="M 235 82 v 18" stroke="#2b7de9" stroke-width="2" marker-end="url(#m)"/>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#33475b"/></marker></defs>
  <!-- контроллер -->
  <rect x="360" y="120" width="250" height="170" rx="10" fill="#f5f8fb" stroke="#33475b" stroke-width="2"/>
  <text x="485" y="110" text-anchor="middle" font-size="12">Контроллер «ГАЗ-ДОЗОР-Д1»</text>
  <rect x="378" y="138" width="214" height="32" rx="5" fill="#dfe7ee" stroke="#33475b" stroke-width="1.2"/>
  <text x="485" y="159" text-anchor="middle" font-size="11">оптическая глубина, период 30 с</text>
  <rect x="378" y="180" width="214" height="32" rx="5" fill="#dfe7ee" stroke="#33475b" stroke-width="1.2"/>
  <text x="485" y="201" text-anchor="middle" font-size="11">фон за 24 ч, порог 3×, 10 минут</text>
  <rect x="378" y="222" width="214" height="32" rx="5" fill="#dfe7ee" stroke="#33475b" stroke-width="1.2"/>
  <text x="485" y="243" text-anchor="middle" font-size="11">повторная проверка через 15 минут</text>
  <path d="M 275 67 q 50 0 85 60" stroke="#33475b" stroke-width="2" fill="none" marker-end="url(#m)"/>
  <!-- 4G и получатели -->
  <circle cx="700" cy="140" r="26" fill="#eaf3fb" stroke="#2b7de9" stroke-width="2"/>
  <text x="700" y="145" text-anchor="middle" font-size="11">4G</text>
  <path d="M 610 160 h 64" stroke="#2b7de9" stroke-width="2" marker-end="url(#m)"/>
  <rect x="660" y="200" width="180" height="70" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
  <text x="750" y="228" text-anchor="middle" font-size="12">Аварийная газовая</text>
  <text x="750" y="248" text-anchor="middle" font-size="12">служба: выезд, акт</text>
  <rect x="660" y="290" width="180" height="70" rx="8" fill="#fdf3e6" stroke="#f0a13c" stroke-width="1.5"/>
  <text x="750" y="318" text-anchor="middle" font-size="12">Диспетчерская УК:</text>
  <text x="750" y="338" text-anchor="middle" font-size="12">работа с квартирой</text>
  <path d="M 700 166 v 34 M 750 270 v 20" stroke="#33475b" stroke-width="1.5" marker-end="url(#m)"/>
  <!-- модельный сценарий -->
  <rect x="360" y="330" width="480" height="180" rx="8" fill="#eef4ee" stroke="#0a7d3c" stroke-width="1.5"/>
  <text x="600" y="356" text-anchor="middle" font-weight="bold" font-size="12">Модель: сценарий 4 МКД, ноябрь 2025 — сентябрь 2026</text>
  <text x="600" y="382" text-anchor="middle" font-size="12">11 месяцев непрерывной телеметрии, период 30 с</text>
  <text x="600" y="404" text-anchor="middle" font-size="12">обнаружены 2 микроутечки: шланг плиты (кв. 34),</text>
  <text x="600" y="422" text-anchor="middle" font-size="12">штуцер (кв. 71) — подтверждены выездом</text>
  <text x="600" y="444" text-anchor="middle" font-size="12">пропущено утечек: 0; аэрозольная тревога снята</text>
  <text x="600" y="466" text-anchor="middle" font-size="12">время до передачи тревоги: 11 минут</text>
  <text x="600" y="488" text-anchor="middle" font-size="12">комплект 240 тыс. руб./дом + сервис 96 тыс. руб./год</text>
</svg>
