<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="430" y="24" text-anchor="middle" font-size="15" font-weight="bold">ТРАНСПОРТНЫЙ КАРКАС: контур города пилота (Армавир)</text>
  <!-- маршруты -->
  <g fill="none" stroke-width="3">
    <path d="M60 320 Q 250 120 430 200 T 800 140" stroke="#1565c0"/>
    <path d="M80 120 Q 300 300 520 260 T 800 330" stroke="#2e7d32"/>
    <path d="M120 380 Q 400 80 760 220" stroke="#c62828"/>
  </g>
  <!-- остановки -->
  <g>
    <circle cx="150" cy="235" r="9" fill="#fff" stroke="#1565c0" stroke-width="3"/>
    <circle cx="430" cy="200" r="9" fill="#fff" stroke="#1565c0" stroke-width="3"/>
    <circle cx="690" cy="155" r="9" fill="#fff" stroke="#1565c0" stroke-width="3"/>
    <circle cx="300" cy="265" r="9" fill="#fff" stroke="#2e7d32" stroke-width="3"/>
    <circle cx="585" cy="255" r="9" fill="#fff" stroke="#2e7d32" stroke-width="3"/>
    <circle cx="370" cy="130" r="9" fill="#fff" stroke="#c62828" stroke-width="3"/>
  </g>
  <text x="430" y="180" text-anchor="middle" fill="#555">умная остановка: табло + валидатор пассажиропотока</text>
  <!-- клиринг -->
  <rect x="640" y="320" width="190" height="70" rx="10" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="735" y="348" text-anchor="middle" font-weight="bold">клиринговый центр</text>
  <text x="735" y="368" text-anchor="middle" fill="#555">выручка по факту пассажиров</text>
  <g stroke="#455a64" stroke-dasharray="5 4" stroke-width="1.5">
    <line x1="690" y1="164" x2="700" y2="320"/>
    <line x1="585" y1="264" x2="700" y2="330"/>
  </g>
  <!-- блок фактов -->
  <rect x="60" y="40" width="270" height="70" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="75" y="62">безнал 31 % → 78 % · сборы +17 %</text>
  <text x="75" y="80">поездки на жителя +9 % · 2,4 млн валидаций</text>
  <text x="75" y="98" fill="#555">18 маршрутов, 92 ТС, 34 остановки</text>
  <text x="430" y="408" text-anchor="middle" fill="#555">Концессия 115-ФЗ: 1,9 млрд руб., 12 лет; капзатраты бюджета на создание системы — 0.</text>
</svg>
