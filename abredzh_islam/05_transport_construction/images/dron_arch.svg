<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="Arial" font-size="13">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold">ПРИЁМКА-ДРОН: облёт дома и сверка факта с проектом</text>
  <!-- дом -->
  <rect x="100" y="220" width="180" height="200" fill="#dfe7ee" stroke="#33475b" stroke-width="2"/>
  <path d="M 90 220 L 190 150 L 290 220 Z" fill="#8fa5ba" stroke="#33475b" stroke-width="2"/>
  <rect x="125" y="250" width="30" height="35" fill="#ffffff" stroke="#33475b" stroke-width="1"/>
  <rect x="175" y="250" width="30" height="35" fill="#ffffff" stroke="#33475b" stroke-width="1"/>
  <rect x="225" y="250" width="30" height="35" fill="#ffffff" stroke="#33475b" stroke-width="1"/>
  <rect x="125" y="320" width="30" height="35" fill="#ffffff" stroke="#33475b" stroke-width="1"/>
  <rect x="175" y="320" width="30" height="35" fill="#ffffff" stroke="#33475b" stroke-width="1"/>
  <rect x="225" y="320" width="30" height="35" fill="#ffffff" stroke="#33475b" stroke-width="1"/>
  <text x="190" y="445" text-anchor="middle" font-size="12">дом программы капремонта</text>
  <!-- дрон -->
  <g transform="translate(360,120)">
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#33475b" stroke-width="3"/>
    <circle cx="-40" cy="0" r="10" fill="#2b7de9" opacity="0.7"/>
    <circle cx="40" cy="0" r="10" fill="#2b7de9" opacity="0.7"/>
    <rect x="-14" y="-4" width="28" height="16" rx="4" fill="#33475b"/>
  </g>
  <text x="360" y="90" text-anchor="middle" font-size="11">облёт по контуру, перекрытие 80/60</text>
  <line x1="340" y1="140" x2="240" y2="185" stroke="#2b7de9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- сравнение -->
  <rect x="480" y="110" width="160" height="130" fill="#f5f8fb" stroke="#33475b" stroke-width="1"/>
  <text x="560" y="132" text-anchor="middle" font-weight="bold" font-size="12">Проект</text>
  <path d="M 500 210 L 560 165 L 620 210 Z" fill="#c8d6c8" stroke="#33475b" stroke-width="1.5"/>
  <text x="560" y="232" text-anchor="middle" font-size="10">тип покрытия, элементы</text>
  <rect x="660" y="110" width="160" height="130" fill="#f5f8fb" stroke="#33475b" stroke-width="1"/>
  <text x="740" y="132" text-anchor="middle" font-weight="bold" font-size="12">Факт (ортофото)</text>
  <path d="M 680 210 L 740 165 L 800 210 Z" fill="#e0c8c8" stroke="#33475b" stroke-width="1.5"/>
  <circle cx="712" cy="198" r="7" fill="#e05c5c"/>
  <text x="740" y="232" text-anchor="middle" font-size="10">2 см/пиксель, дефекты видны</text>
  <text x="645" y="180" text-anchor="middle" font-size="20">≟</text>
  <!-- протокол -->
  <rect x="480" y="280" width="340" height="140" fill="#eef4ee" stroke="#0a7d3c" stroke-width="1.5"/>
  <text x="650" y="306" text-anchor="middle" font-weight="bold" font-size="12">Протокол расхождений → акт приёмки (615-ПП)</text>
  <text x="650" y="332" text-anchor="middle" font-size="12">каждое расхождение: геометрия + фотофиксация</text>
  <text x="650" y="356" text-anchor="middle" font-size="12">комиссия: устранить / принять с замечанием / удержать оплату</text>
  <text x="650" y="380" text-anchor="middle" font-size="12">через год: повторный облёт — динамика состояния</text>
  <text x="650" y="404" text-anchor="middle" font-size="11">производительность: 3 дома в день на команду</text>
</svg>
