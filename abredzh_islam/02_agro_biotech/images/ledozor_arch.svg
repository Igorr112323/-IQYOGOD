<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="Arial" font-size="13">
  <rect width="880" height="520" fill="#ffffff"/>
  <text x="440" y="26" text-anchor="middle" font-size="16" font-weight="bold">ЛЕДОЗОР: микроволновый радиометр и трёхслойная модель «снег — лёд — почва»</text>
  <!-- разрез поля -->
  <rect x="60" y="300" width="440" height="50" fill="#eef4fb" stroke="#33475b" stroke-width="1.5"/>
  <text x="280" y="330" text-anchor="middle" font-size="12">снег, глубина d_snow 0–40 см</text>
  <rect x="60" y="350" width="440" height="34" fill="#cfe6f5" stroke="#2b7de9" stroke-width="1.5"/>
  <text x="280" y="372" text-anchor="middle" font-size="12">ледяная корка, толщина h_ice 0–8 см (притёртая / висячая)</text>
  <rect x="60" y="384" width="440" height="46" fill="#8a6a4a" stroke="#33475b" stroke-width="1.5"/>
  <text x="280" y="412" text-anchor="middle" font-size="12" fill="#ffffff">мёрзлая почва, узел кущения озимых</text>
  <!-- внедорожник -->
  <rect x="120" y="228" width="150" height="52" rx="10" fill="#dfe7ee" stroke="#33475b" stroke-width="2"/>
  <rect x="150" y="200" width="70" height="30" rx="6" fill="#dfe7ee" stroke="#33475b" stroke-width="2"/>
  <circle cx="150" cy="284" r="14" fill="#33475b"/>
  <circle cx="240" cy="284" r="14" fill="#33475b"/>
  <rect x="176" y="182" width="60" height="18" rx="4" fill="#f0a13c" stroke="#33475b" stroke-width="1.5"/>
  <text x="206" y="176" text-anchor="middle" font-size="11">радиометр 10,7 / 36,5 ГГц</text>
  <!-- волны -->
  <path d="M 210 200 q 20 40 60 96" stroke="#2b7de9" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#m)"/>
  <path d="M 300 296 q -30 -50 -55 -92" stroke="#0a7d3c" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#m)"/>
  <text x="330" y="250" font-size="11">собственное МВ-излучение среды</text>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#33475b"/></marker></defs>
  <!-- блок обработки -->
  <rect x="560" y="120" width="270" height="180" rx="10" fill="#f5f8fb" stroke="#33475b" stroke-width="2"/>
  <text x="695" y="110" text-anchor="middle" font-size="12">Вычислительный блок в салоне</text>
  <rect x="580" y="140" width="230" height="34" rx="6" fill="#dfe7ee" stroke="#33475b" stroke-width="1.5"/>
  <text x="695" y="162" text-anchor="middle" font-size="11">4 яркостные температуры: 10,7 / 36,5 ГГц × 2 поляризации</text>
  <rect x="580" y="186" width="230" height="34" rx="6" fill="#dfe7ee" stroke="#33475b" stroke-width="1.5"/>
  <text x="695" y="208" text-anchor="middle" font-size="11">обратная задача: d_snow, h_ice, тип корки</text>
  <rect x="580" y="232" width="230" height="34" rx="6" fill="#dfe7ee" stroke="#33475b" stroke-width="1.5"/>
  <text x="695" y="254" text-anchor="middle" font-size="11">карта поля, ячейка 10 м, ГЛОНАСС-привязка</text>
  <path d="M 500 240 h 60" stroke="#33475b" stroke-width="2" marker-end="url(#m)"/>
  <!-- выходы -->
  <rect x="560" y="330" width="270" height="150" fill="#eef4ee" stroke="#0a7d3c" stroke-width="1.5"/>
  <text x="695" y="356" text-anchor="middle" font-weight="bold" font-size="12">Выходы кампании</text>
  <text x="695" y="382" text-anchor="middle" font-size="12">хозяйство: карта и решение — 160 руб./га</text>
  <text x="695" y="404" text-anchor="middle" font-size="12">страховая: инструментальный акт — 9 000 руб.</text>
  <text x="695" y="426" text-anchor="middle" font-size="12">штаб зимовки: сводка по зонам края</text>
  <text x="695" y="452" text-anchor="middle" font-size="11">300 га/день на комплекс; скорость до 20 км/ч</text>
  <path d="M 695 300 v 30" stroke="#33475b" stroke-width="2" marker-end="url(#m)"/>
  <!-- пилот -->
  <rect x="60" y="450" width="440" height="50" rx="8" fill="#eaf3fb" stroke="#2b7de9" stroke-width="1.5"/>
  <text x="280" y="480" text-anchor="middle" font-size="12">Пилот 2026: 2 400 га, корка 2–4 см на 340 га, сохранность 96 % против 71 %</text>
</svg>
