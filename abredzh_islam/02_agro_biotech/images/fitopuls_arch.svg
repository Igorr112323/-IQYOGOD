<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="Arial" font-size="13">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold">ФИТОПУЛЬС: полевой флуориметр и карта сроков</text>
  <!-- поле -->
  <rect x="60" y="330" width="380" height="110" fill="#dcefd2" stroke="#33475b" stroke-width="1.5"/>
  <text x="250" y="465" text-anchor="middle" font-size="12">Озимая пшеница: 1 опорная точка на 250–300 га</text>
  <!-- растения -->
  <path d="M 120 420 q -6 -30 0 -52 M 120 420 q 8 -26 20 -40 M 120 420 q -10 -22 -22 -34" stroke="#0a7d3c" stroke-width="2.5" fill="none"/>
  <path d="M 210 420 q -6 -30 0 -52 M 210 420 q 8 -26 20 -40 M 210 420 q -10 -22 -22 -34" stroke="#0a7d3c" stroke-width="2.5" fill="none"/>
  <!-- штанга и прибор -->
  <rect x="320" y="240" width="8" height="180" fill="#33475b"/>
  <rect x="295" y="210" width="60" height="36" rx="6" fill="#dfe7ee" stroke="#33475b" stroke-width="2"/>
  <text x="325" y="196" text-anchor="middle" font-size="11">флуориметр: 455→685 нм</text>
  <line x1="310" y1="246" x2="235" y2="380" stroke="#2b7de9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="255" y="330" font-size="10" fill="#2b7de9">кривая индукции, 90 с, каждые 4 ч</text>
  <!-- кривая индукции -->
  <rect x="500" y="80" width="320" height="160" fill="#f5f8fb" stroke="#33475b" stroke-width="1"/>
  <text x="660" y="104" text-anchor="middle" font-weight="bold" font-size="12">Индукция флуоресценции (Каутский)</text>
  <path d="M 520 200 L 540 130 L 560 160 L 600 140 L 660 150 L 790 165" fill="none" stroke="#0a7d3c" stroke-width="2"/>
  <path d="M 520 210 L 540 155 L 560 185 L 600 170 L 660 178 L 790 186" fill="none" stroke="#e05c5c" stroke-width="2"/>
  <text x="795" y="150" font-size="10" fill="#0a7d3c">норма</text>
  <text x="795" y="180" font-size="10" fill="#e05c5c">стресс: Fv/Fm ниже</text>
  <!-- карта сроков -->
  <rect x="500" y="270" width="320" height="170" fill="#ffffff" stroke="#33475b" stroke-width="1"/>
  <text x="660" y="294" text-anchor="middle" font-weight="bold" font-size="12">Карта сроков, раз в 3 суток</text>
  <rect x="520" y="310" width="60" height="40" fill="#0a7d3c" opacity="0.75"/><text x="550" y="335" text-anchor="middle" font-size="10" fill="#fff">норма</text>
  <rect x="585" y="310" width="60" height="40" fill="#f0a13c" opacity="0.85"/><text x="615" y="335" text-anchor="middle" font-size="10">полив 48 ч</text>
  <rect x="650" y="310" width="60" height="40" fill="#e05c5c" opacity="0.8"/><text x="680" y="335" text-anchor="middle" font-size="10" fill="#fff">стресс</text>
  <rect x="715" y="310" width="60" height="40" fill="#33475b" opacity="0.6"/><text x="745" y="335" text-anchor="middle" font-size="10" fill="#fff">окно уборки</text>
  <text x="660" y="380" text-anchor="middle" font-size="11">опережение видимых признаков: 3–6 суток</text>
  <text x="660" y="404" text-anchor="middle" font-size="11">решение принимает агроном по опорным точкам</text>
  <text x="660" y="428" text-anchor="middle" font-size="11">данные — в обоснование мелиоративных субсидий</text>
</svg>
