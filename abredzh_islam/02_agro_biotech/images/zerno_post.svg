<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" font-size="15" font-weight="bold">Мобильный пост «ЗЕРНОВОЙ ПАСПОРТ» у весовой</text>
  <!-- машина на весовой -->
  <rect x="60" y="220" width="180" height="70" fill="#a1887f" stroke="#5d4037" stroke-width="2"/>
  <circle cx="100" cy="300" r="16" fill="#37474f"/><circle cx="200" cy="300" r="16" fill="#37474f"/>
  <text x="150" y="200" text-anchor="middle">зерновоз на весах</text>
  <path d="M150 160 l20 -30 l20 30" fill="#ffca28" stroke="#ef6c00"/>
  <text x="170" y="120" text-anchor="middle" font-size="11">зерно</text>
  <!-- щуп -->
  <line x1="240" y1="200" x2="290" y2="250" stroke="#ef6c00" stroke-width="4"/>
  <text x="300" y="200">пробоотборник из кузова</text>
  <!-- пост -->
  <rect x="330" y="230" width="200" height="120" rx="10" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="430" y="258" text-anchor="middle" font-weight="bold">Мобильный пост</text>
  <text x="430" y="280" text-anchor="middle">ИК-анализ 90 секунд</text>
  <text x="430" y="298" text-anchor="middle">влажность · натура · протеин</text>
  <text x="430" y="316" text-anchor="middle">клейковина · сорная примесь</text>
  <text x="430" y="334" text-anchor="middle">220 В или аккумулятор</text>
  <path d="M290 250 L330 280" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- паспорт -->
  <rect x="590" y="100" width="250" height="120" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="715" y="128" text-anchor="middle" font-weight="bold">Паспорт партии</text>
  <text x="715" y="150" text-anchor="middle">параметры, фото, весовая, время</text>
  <text x="715" y="168" text-anchor="middle">в учёт хозяйства — сразу</text>
  <text x="715" y="186" text-anchor="middle">основание взаиморасчётов</text>
  <path d="M530 260 L590 170" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- маршрутизация -->
  <rect x="590" y="250" width="250" height="130" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="715" y="278" text-anchor="middle" font-weight="bold">Маршрутизация партии</text>
  <text x="715" y="300" text-anchor="middle">влажность выше 14 % — доработка</text>
  <text x="715" y="318" text-anchor="middle">протеин выше порога — хранение по классу</text>
  <text x="715" y="336" text-anchor="middle">норма — приём в общий поток</text>
  <text x="715" y="354" text-anchor="middle">расчёт эффекта каждой партии</text>
  <path d="M530 300 L590 310" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <text x="440" y="400" text-anchor="middle">пост 890 тыс. руб. · без лаборатории и химика · сверка с аккредитованной лабораторией 0,4 п.п.</text>
</svg>
