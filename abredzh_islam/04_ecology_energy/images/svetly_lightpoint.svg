  <text x="720" y="350" fill="#555">05:00</text>
  <text x="645" y="150" text-anchor="middle">мощность светильника по часам</text>
  <text x="420" y="395" text-anchor="middle" fill="#555">Расчёт: 412 светоточек · −68 % кВт·ч · освещённость 4,1 → 9,3 лк · проект контракта 3,4 млн руб., окупаемость у поселения 6,1 года.</text>
