<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="430" y="24" text-anchor="middle" font-size="15" font-weight="bold">ФАРМЛОГИСТИКА-ЮГ: хаб и маршруты доставки (норматив 24 ч)</text>
  <!-- хаб -->
  <rect x="340" y="170" width="180" height="100" rx="12" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="430" y="200" text-anchor="middle" font-weight="bold">ФАРМАХАБ 4 500 м²</text>
  <text x="430" y="220" text-anchor="middle">холод 2-8 °С, −18…−25 °С</text>
  <text x="430" y="240" text-anchor="middle" fill="#555">страховой запас: 40 позиций</text>
  <!-- медорганизации -->
  <g font-size="11">
    <circle cx="120" cy="80" r="26" fill="#ffebee" stroke="#b71c1c"/><text x="120" y="84" text-anchor="middle">ЦРБ-1</text>
    <circle cx="740" cy="80" r="26" fill="#ffebee" stroke="#b71c1c"/><text x="740" y="84" text-anchor="middle">ЦРБ-2</text>
    <circle cx="90" cy="250" r="26" fill="#e8f5e9" stroke="#1b5e20"/><text x="90" y="254" text-anchor="middle">ФАП-сеть</text>
    <circle cx="780" cy="260" r="26" fill="#e8f5e9" stroke="#1b5e20"/><text x="780" y="264" text-anchor="middle">ФАП-сеть</text>
    <circle cx="230" cy="370" r="26" fill="#fff8e1" stroke="#b07d00"/><text x="230" y="374" text-anchor="middle">поликлиника</text>
    <circle cx="650" cy="370" r="26" fill="#fff8e1" stroke="#b07d00"/><text x="650" y="374" text-anchor="middle">поликлиника</text>
  </g>
  <!-- маршруты -->
  <g stroke="#15417d" stroke-width="1.6" fill="none" stroke-dasharray="6 4">
    <line x1="350" y1="185" x2="146" y2="90"/>
    <line x1="510" y1="185" x2="714" y2="90"/>
    <line x1="345" y1="230" x2="116" y2="246"/>
    <line x1="515" y1="230" x2="754" y2="256"/>
    <line x1="380" y1="270" x2="246" y2="352"/>
    <line x1="480" y1="270" x2="634" y2="352"/>
  </g>
  <text x="430" y="320" text-anchor="middle" fill="#555">40 маршрутов, плечо до 140 км; терморегистраторы в каждой машине; алерт при отклонении температуры.</text>
  <text x="430" y="400" text-anchor="middle" fill="#0d47a1">Пилот: дефектура 14 → 1,5 дня · поставка 26 ч · списания −64 % · закупки −9 %.</text>
</svg>
