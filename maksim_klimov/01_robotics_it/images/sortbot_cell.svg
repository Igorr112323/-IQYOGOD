<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" font-size="15" font-weight="bold">СОРТБОТ-ЮГ-М1: модуль над лентой (вид сбоку)</text>
  <!-- лента -->
  <rect x="40" y="330" width="800" height="26" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
  <circle cx="60" cy="343" r="12" fill="#90a4ae"/><circle cx="820" cy="343" r="12" fill="#90a4ae"/>
  <text x="46" y="376">лента 1,2 м, 1,6 м/с →</text>
  <!-- мусор на ленте -->
  <rect x="180" y="312" width="34" height="14" rx="3" fill="#c5e1a5" stroke="#558b2f"/>
  <rect x="330" y="308" width="44" height="18" rx="4" fill="#b3e5fc" stroke="#0277bd"/>
  <rect x="520" y="312" width="30" height="12" rx="3" fill="#ffe082" stroke="#ef6c00"/>
  <rect x="660" y="310" width="40" height="16" rx="4" fill="#d1c4e9" stroke="#4527a0"/>
  <text x="300" y="300" fill="#455a64">поток ТКО (плёнка подсвечена моделью)</text>
  <!-- рама -->
  <rect x="140" y="90" width="14" height="240" fill="#78909c" stroke="#37474f"/>
  <rect x="700" y="90" width="14" height="240" fill="#78909c" stroke="#37474f"/>
  <rect x="140" y="76" width="574" height="16" fill="#90a4ae" stroke="#37474f"/>
  <!-- камера -->
  <rect x="220" y="96" width="52" height="28" rx="4" fill="#1a237e" stroke="#0d47a1"/>
  <line x1="246" y1="124" x2="330" y2="300" stroke="#0d47a1" stroke-dasharray="4 3"/>
  <text x="180" y="150" fill="#0d47a1">камера 60 кадр/с</text>
  <!-- манипулятор -->
  <rect x="430" y="96" width="90" height="34" rx="6" fill="#37474f" stroke="#263238"/>
  <line x1="475" y1="130" x2="420" y2="210" stroke="#263238" stroke-width="5"/>
  <line x1="475" y1="130" x2="540" y2="215" stroke="#263238" stroke-width="5"/>
  <circle cx="480" cy="228" r="16" fill="#ffca28" stroke="#ef6c00" stroke-width="3"/>
  <path d="M466 240 q14 16 28 0" stroke="#ef6c00" stroke-width="3" fill="none"/>
  <text x="510" y="250" fill="#ef6c00">вакуумно-импульсный захват: прихлоп + присос</text>
  <!-- бункер -->
  <rect x="560" y="270" width="120" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="620" y="294" text-anchor="middle">бункер плёнки</text>
  <text x="620" y="312" text-anchor="middle">25–30 т/мес</text>
  <path d="M480 244 q90 10 84 30" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="none"/>
  <!-- шкаф -->
  <rect x="60" y="180" width="120" height="90" rx="8" fill="#e8eaf6" stroke="#4527a0"/>
  <text x="120" y="204" text-anchor="middle" font-weight="bold">шкаф управления</text>
  <text x="120" y="224" text-anchor="middle">модель зрения</text>
  <text x="120" y="240" text-anchor="middle">контроллер, телеметрия</text>
  <line x1="180" y1="220" x2="220" y2="120" stroke="#4527a0" stroke-dasharray="3 3"/>
  <text x="440" y="412" text-anchor="middle" fill="#455a64">Монтаж на действующую линию — 5 дней без остановки комплекса более чем на смену</text>
</svg>
