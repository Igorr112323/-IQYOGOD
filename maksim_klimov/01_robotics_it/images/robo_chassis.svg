<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="820" height="430" fill="#ffffff"/>
  <text x="410" y="24" text-anchor="middle" font-size="15" font-weight="bold">ЮЖНЫЙ РОБОКУРЬЕР: ровер К-2 (габаритный чертёж, вид сбоку)</text>
  <!-- корпус -->
  <rect x="240" y="120" width="340" height="140" rx="16" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="410" y="150" text-anchor="middle" font-weight="bold">грузовой бокс 60 л</text>
  <text x="410" y="170" text-anchor="middle">электронный замок, термостат</text>
  <text x="410" y="190" text-anchor="middle">грузоподъёмность 60 кг</text>
  <rect x="250" y="215" width="320" height="34" rx="8" fill="#bbdefb" stroke="#0d47a1"/>
  <text x="410" y="237" text-anchor="middle">батарея 48 В · 30 А·ч · запас хода 55 км</text>
  <!-- колёса -->
  <circle cx="290" cy="300" r="34" fill="#263238"/>
  <circle cx="290" cy="300" r="14" fill="#90a4ae"/>
  <circle cx="530" cy="300" r="34" fill="#263238"/>
  <circle cx="530" cy="300" r="14" fill="#90a4ae"/>
  <text x="290" y="352" text-anchor="middle">мотор-колесо 350 Вт</text>
  <text x="530" y="352" text-anchor="middle">мотор-колесо 350 Вт</text>
  <!-- сенсоры -->
  <rect x="560" y="100" width="34" height="26" rx="6" fill="#fff59d" stroke="#f57f17"/>
  <text x="640" y="118">лидар 16 кан.</text>
  <rect x="226" y="100" width="34" height="26" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="180" y="118">стереокамера</text>
  <!-- размеры -->
  <line x1="240" y1="90" x2="580" y2="90" stroke="#616161"/>
  <text x="410" y="82" text-anchor="middle">980 мм</text>
  <line x1="620" y1="120" x2="620" y2="334" stroke="#616161"/>
  <text x="640" y="230">720 мм</text>
  <!-- станция -->
  <rect x="40" y="250" width="150" height="84" rx="10" fill="#fff3e0" stroke="#e65100"/>
  <text x="115" y="274" text-anchor="middle">станция-шезлонг</text>
  <text x="115" y="292" text-anchor="middle">4 слота · солнечный</text>
  <text x="115" y="310" text-anchor="middle">навес 4 кВт</text>
  <line x1="190" y1="292" x2="240" y2="260" stroke="#e65100" stroke-dasharray="4 3"/>
  <text x="410" y="410" text-anchor="middle" fill="#555">Клиренс 120 мм; скорость в пешеходной зоне 10 км/ч; 320 км ресурсных испытаний, 99,2 % разъездов.</text>
</svg>
