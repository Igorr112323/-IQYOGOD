<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="Arial" font-size="13">
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold">Контейнерная линия ЛОЗА-ФУРАЖ у винодельни</text>
  <!-- винодельня -->
  <rect x="40" y="150" width="150" height="110" fill="#f3e9f7" stroke="#7a4a8a" stroke-width="2"/>
  <text x="115" y="140" text-anchor="middle" font-size="12">Винодельня: отжим</text>
  <text x="115" y="210" text-anchor="middle" font-size="11">выжимка 150–250 кг</text>
  <text x="115" y="228" text-anchor="middle" font-size="11">с каждой тонны</text>
  <!-- стрелка -->
  <line x1="190" y1="205" x2="255" y2="205" stroke="#33475b" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#33475b"/></marker></defs>
  <!-- контейнеры -->
  <rect x="260" y="150" width="90" height="110" rx="6" fill="#dfe7ee" stroke="#33475b" stroke-width="2"/>
  <rect x="360" y="150" width="90" height="110" rx="6" fill="#dfe7ee" stroke="#33475b" stroke-width="2"/>
  <rect x="460" y="150" width="90" height="110" rx="6" fill="#eef4ee" stroke="#0a7d3c" stroke-width="2"/>
  <text x="305" y="200" text-anchor="middle" font-size="11">20 м³</text>
  <text x="405" y="200" text-anchor="middle" font-size="11">20 м³</text>
  <text x="505" y="195" text-anchor="middle" font-size="11">рН 4,1</text>
  <text x="505" y="212" text-anchor="middle" font-size="11">готов</text>
  <text x="405" y="290" text-anchor="middle" font-size="12">Закваска 4 л/т, ферментация 21 день</text>
  <!-- ферма -->
  <rect x="610" y="150" width="150" height="110" fill="#fdf3e3" stroke="#b07a2e" stroke-width="2"/>
  <text x="685" y="140" text-anchor="middle" font-size="12">Молочная ферма</text>
  <text x="685" y="200" text-anchor="middle" font-size="11">ввод 8–12 % СВ</text>
  <text x="685" y="218" text-anchor="middle" font-size="11">надой +4,2 %</text>
  <line x1="550" y1="205" x2="605" y2="205" stroke="#33475b" stroke-width="2" marker-end="url(#a)"/>
  <!-- экономика -->
  <rect x="120" y="330" width="620" height="100" fill="#f5f8fb" stroke="#33475b" stroke-width="1"/>
  <text x="430" y="352" text-anchor="middle" font-weight="bold" font-size="13">Юнит-экономика, руб/т</text>
  <text x="150" y="376" font-size="12">Себестоимость 1 750: закваска 210 · логистика 640 · работа 390 · амортизация 510</text>
  <text x="150" y="398" font-size="12">Цена продажи 2 900 → маржа 39,7 %</text>
  <text x="150" y="420" font-size="12">Линия 5 000 т/сезон: прибыль медиана 5,8 млн/год, окупаемость 8,5 мес</text>
</svg>
