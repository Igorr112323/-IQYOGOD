<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="bold">КУБАНЬ-ХРУСТ: линия 120 кг сырья/сутки (план цеха 140 м²)</text>
  <g>
    <rect x="30" y="80" width="120" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="90" y="110" text-anchor="middle">приёмка</text>
    <text x="90" y="128" text-anchor="middle">инспекция, весы</text>
    <rect x="180" y="80" width="120" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
    <text x="240" y="110" text-anchor="middle">мойка</text>
    <text x="240" y="128" text-anchor="middle">нарезка 4 мм</text>
    <rect x="330" y="80" width="150" height="70" rx="8" fill="#fff3e0" stroke="#e65100"/>
    <text x="405" y="104" text-anchor="middle">ИК-модуль</text>
    <text x="405" y="122" text-anchor="middle">4 карбоновые лампы</text>
    <text x="405" y="140" text-anchor="middle">пирометр, 40 мин</text>
    <rect x="510" y="80" width="140" height="70" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="580" y="104" text-anchor="middle">конвекция ×2</text>
    <text x="580" y="122" text-anchor="middle">рекуперация тепла</text>
    <text x="580" y="140" text-anchor="middle">до влажности ≤6%</text>
    <rect x="680" y="80" width="150" height="70" rx="8" fill="#fce4ec" stroke="#ad1457"/>
    <text x="755" y="104" text-anchor="middle">упаковка в азоте</text>
    <text x="755" y="122" text-anchor="middle">+ QR-паспорт партии</text>
    <text x="755" y="140" text-anchor="middle">этикетка ХАССП</text>
  </g>
  <line x1="150" y1="115" x2="180" y2="115" stroke="#37474f" stroke-width="3" marker-end="url(#a)"/>
  <line x1="300" y1="115" x2="330" y2="115" stroke="#37474f" stroke-width="3"/>
  <line x1="480" y1="115" x2="510" y2="115" stroke="#37474f" stroke-width="3"/>
  <line x1="650" y1="115" x2="680" y2="115" stroke="#37474f" stroke-width="3"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#37474f"/></marker></defs>
  <rect x="30" y="200" width="380" height="80" rx="8" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="220" y="225" text-anchor="middle">склад сырья 40 м² (заморозка ягод −18 °С)</text>
  <text x="220" y="245" text-anchor="middle">вход: яблоко, груша, виноград, слива, клубника</text>
  <text x="220" y="263" text-anchor="middle">формульная закупка: база −20 % + премия за объём</text>
  <rect x="440" y="200" width="390" height="80" rx="8" fill="#fffde7" stroke="#f9a825"/>
  <text x="635" y="225" text-anchor="middle">готовая продукция: 8,5:1 по яблоку</text>
  <text x="635" y="245" text-anchor="middle">SKU: чипсы · криспы · пастила</text>
  <text x="635" y="263" text-anchor="middle">энергия 1,9 кВт·ч/кг (−30 % против конвекции)</text>
  <text x="450" y="340" text-anchor="middle" fill="#555">Пилотный цех работает с 02.2026; отгружено 612 кг; оценка дегустаций 4,7/5 (2 отеля Сириуса).</text>
