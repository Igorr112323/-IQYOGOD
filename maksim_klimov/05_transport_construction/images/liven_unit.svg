<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" font-size="15" font-weight="bold">Датчики «ЛИВЕНЬ»: на решётке и в коллекторе</text>
  <!-- левая часть: решётка -->
  <rect x="40" y="120" width="360" height="260" rx="8" fill="#eceff1" stroke="#546e7a"/>
  <text x="220" y="146" text-anchor="middle" font-weight="bold">ЛИВЕНЬ-Р: засор решётки</text>
  <rect x="80" y="200" width="280" height="16" fill="#90a4ae" stroke="#37474f"/>
  <g stroke="#37474f" stroke-width="3">
    <line x1="100" y1="200" x2="100" y2="216"/><line x1="140" y1="200" x2="140" y2="216"/>
    <line x1="180" y1="200" x2="180" y2="216"/><line x1="220" y1="200" x2="220" y2="216"/>
    <line x1="260" y1="200" x2="260" y2="216"/><line x1="300" y1="200" x2="300" y2="216"/>
  </g>
  <rect x="196" y="230" width="48" height="30" rx="5" fill="#ffca28" stroke="#ef6c00" stroke-width="2"/>
  <text x="220" y="250" text-anchor="middle" font-size="10">сенсор</text>
  <text x="220" y="290" text-anchor="middle">акустика потока: чисто / частично / забито</text>
  <text x="220" y="310" text-anchor="middle">монтаж на решётку — 15 минут, без рытья</text>
  <text x="220" y="332" text-anchor="middle">батарея 2 года · антивандальный корпус · 96 тыс. руб.</text>
  <!-- правая часть: коллектор -->
  <rect x="480" y="120" width="360" height="260" rx="8" fill="#eceff1" stroke="#546e7a"/>
  <text x="660" y="146" text-anchor="middle" font-weight="bold">ЛИВЕНЬ-К: уровень в коллекторе</text>
  <circle cx="660" cy="240" r="80" fill="#cfd8dc" stroke="#455a64" stroke-width="3"/>
  <rect x="580" y="260" width="160" height="58" fill="#4fc3f7" opacity="0.85"/>
  <rect x="636" y="170" width="48" height="26" rx="5" fill="#ffca28" stroke="#ef6c00" stroke-width="2"/>
  <text x="660" y="187" text-anchor="middle" font-size="10">уровнемер</text>
  <line x1="660" y1="196" x2="660" y2="260" stroke="#ef6c00" stroke-dasharray="4 3"/>
  <text x="660" y="350" text-anchor="middle">ультразвук: уровень и скорость наполнения</text>
  <text x="660" y="370" text-anchor="middle">крепление в люк · 140 тыс. руб.</text>
  <!-- связь -->
  <path d="M220 260 q220 -90 440 -52" stroke="#0d47a1" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <text x="440" y="90" text-anchor="middle" fill="#0d47a1">LoRaWAN → платформа: гидравлическая модель квартала + наряды бригадам за 2–4 ч до дождя</text>
</svg>
