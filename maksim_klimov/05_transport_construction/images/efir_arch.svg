<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="Arial" font-size="13">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold">ЭФИР-ДОЖДЬ: линии связи как сеть дождемеров</text>
  <!-- карта района -->
  <rect x="60" y="60" width="440" height="330" fill="#f0f5fa" stroke="#33475b" stroke-width="1.5"/>
  <!-- базовые станции -->
  <circle cx="140" cy="120" r="9" fill="#2b7de9"/><circle cx="300" cy="100" r="9" fill="#2b7de9"/>
  <circle cx="430" cy="150" r="9" fill="#2b7de9"/><circle cx="180" cy="250" r="9" fill="#2b7de9"/>
  <circle cx="340" cy="230" r="9" fill="#2b7de9"/><circle cx="120" cy="340" r="9" fill="#2b7de9"/>
  <circle cx="280" cy="340" r="9" fill="#2b7de9"/><circle cx="440" cy="310" r="9" fill="#2b7de9"/>
  <!-- линии -->
  <line x1="140" y1="120" x2="300" y2="100" stroke="#8fa5ba" stroke-width="1.5"/>
  <line x1="300" y1="100" x2="430" y2="150" stroke="#8fa5ba" stroke-width="1.5"/>
  <line x1="140" y1="120" x2="180" y2="250" stroke="#8fa5ba" stroke-width="1.5"/>
  <line x1="300" y1="100" x2="340" y2="230" stroke="#8fa5ba" stroke-width="1.5"/>
  <line x1="180" y1="250" x2="340" y2="230" stroke="#e05c5c" stroke-width="2.5"/>
  <line x1="180" y1="250" x2="120" y2="340" stroke="#8fa5ba" stroke-width="1.5"/>
  <line x1="180" y1="250" x2="280" y2="340" stroke="#e05c5c" stroke-width="2.5"/>
  <line x1="340" y1="230" x2="440" y2="310" stroke="#8fa5ba" stroke-width="1.5"/>
  <line x1="280" y1="340" x2="440" y2="310" stroke="#8fa5ba" stroke-width="1.5"/>
  <!-- ячейка ливня -->
  <ellipse cx="230" cy="290" rx="85" ry="60" fill="#2b7de9" opacity="0.18"/>
  <ellipse cx="230" cy="290" rx="50" ry="34" fill="#2b7de9" opacity="0.3"/>
  <text x="230" y="295" text-anchor="middle" font-size="12" fill="#14549c">Ячейка ливня 38 мм/ч</text>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#33475b">БС оператора</text>
  <text x="250" y="212" text-anchor="middle" font-size="11" fill="#e05c5c">линии с высоким затуханием</text>
  <!-- легенда выход -->
  <rect x="540" y="80" width="280" height="150" fill="#f5f8fb" stroke="#33475b" stroke-width="1"/>
  <text x="680" y="104" text-anchor="middle" font-weight="bold" font-size="13">Карта города, шаг 500 м, 1 мин</text>
  <rect x="560" y="120" width="20" height="12" fill="#e05c5c"/><text x="588" y="131" font-size="11">интенсивность &gt; 30 мм/ч</text>
  <rect x="560" y="140" width="20" height="12" fill="#2b7de9" opacity="0.4"/><text x="588" y="151" font-size="11">ячейка ливня, прогноз пика</text>
  <rect x="560" y="160" width="20" height="12" fill="#ffd23f"/><text x="588" y="171" font-size="11">наряд: насос/решётка за 17–23 мин</text>
  <text x="680" y="205" text-anchor="middle" font-size="11">r = 0,91 с сетью дождемеров пилота</text>
  <!-- диспетчерская -->
  <rect x="540" y="260" width="280" height="130" fill="#eef4ee" stroke="#0a7d3c" stroke-width="1.5"/>
  <text x="680" y="284" text-anchor="middle" font-weight="bold" font-size="13">Потребители</text>
  <text x="560" y="308" font-size="12">Диспетчерская ливневой канализации</text>
  <text x="560" y="328" font-size="12">МУП КТТУ: трамвайные трассы</text>
  <text x="560" y="348" font-size="12">Мобильное приложение выездных бригад</text>
  <text x="560" y="368" font-size="12">Администрация: сводка событий</text>
</svg>
