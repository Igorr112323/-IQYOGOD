<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="430" y="24" text-anchor="middle" font-size="15" font-weight="bold">«ОКО-СКРИН-1»: скрининговая станция в кабинете эндокринолога</text>
  <!-- сканер -->
  <rect x="90" y="140" width="170" height="130" rx="16" fill="#e3f2fd" stroke="#0d47a1" stroke-width="3"/>
  <circle cx="175" cy="195" r="34" fill="#0d47a1"/>
  <circle cx="175" cy="195" r="20" fill="#90caf9"/>
  <text x="175" y="292" text-anchor="middle">фундус-сканер 45°, 2,8 кг</text>
  <text x="175" y="310" text-anchor="middle" fill="#0d47a1">без расширения зрачка, 90 с</text>
  <!-- бортовой модуль -->
  <rect x="330" y="150" width="180" height="110" rx="10" fill="#ede7f6" stroke="#4527a0" stroke-width="2"/>
  <text x="420" y="176" text-anchor="middle" font-weight="bold">бортовой ИИ-модуль</text>
  <text x="420" y="198" text-anchor="middle">офлайн, без облака</text>
  <text x="420" y="216" text-anchor="middle">заключение за 40 с</text>
  <text x="420" y="236" text-anchor="middle">аккумулятор 120 исследований/день</text>
  <!-- планшет -->
  <rect x="580" y="150" width="120" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="640" y="176" text-anchor="middle" font-weight="bold">планшет</text>
  <text x="640" y="198" text-anchor="middle">оператора</text>
  <text x="640" y="216" text-anchor="middle">автоконтроль</text>
  <text x="640" y="234" text-anchor="middle">качества кадра</text>
  <!-- связи -->
  <line x1="260" y1="205" x2="330" y2="205" stroke="#455a64" stroke-width="2"/>
  <line x1="510" y1="205" x2="580" y2="205" stroke="#455a64" stroke-width="2"/>
  <!-- маршрутизация -->
  <rect x="330" y="300" width="470" height="80" rx="10" fill="#fff8e1" stroke="#f9a825"/>
  <text x="565" y="324" text-anchor="middle" font-weight="bold">Маршрутизация (валидация 1 140 пациентов):</text>
  <text x="565" y="344" text-anchor="middle">норма → скрининг через 12 мес · подозрение (61) → телеприём 14 дней</text>
  <text x="565" y="362" text-anchor="middle">угрожающие признаки (9) → очный приём за 3 дня · шлюз в МИС поликлиники</text>
  <line x1="420" y1="260" x2="420" y2="300" stroke="#f9a825" stroke-width="2"/>
  <text x="430" y="408" text-anchor="middle" fill="#455a64">Монтаж точки — 1 день; обучение ассистента — 4 часа; чувствительность 0,92 / специфичность 0,87</text>
</svg>
