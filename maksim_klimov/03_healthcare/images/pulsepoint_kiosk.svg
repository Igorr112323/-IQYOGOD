<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="bold">ПУЛЬС-ПОЙНТ: станция (габаритный чертёж, фронт/бок)</text>
  <!-- фронт -->
  <rect x="80" y="60" width="240" height="340" rx="14" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <rect x="110" y="90" width="180" height="110" rx="8" fill="#ffffff" stroke="#0d47a1"/>
  <text x="200" y="140" text-anchor="middle">сенсорный экран 15"</text>
  <text x="200" y="158" text-anchor="middle">анкета + результат + оплата</text>
  <rect x="110" y="220" width="80" height="60" rx="8" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="150" y="245" text-anchor="middle">тонометр</text>
  <text x="150" y="262" text-anchor="middle">авто</text>
  <rect x="210" y="220" width="80" height="60" rx="8" fill="#ffe0b2" stroke="#e65100"/>
  <text x="250" y="245" text-anchor="middle">пульсокси-</text>
  <text x="250" y="262" text-anchor="middle">метр</text>
  <rect x="110" y="295" width="80" height="50" rx="8" fill="#fce4ec" stroke="#ad1457"/>
  <text x="150" y="317" text-anchor="middle">ИК-термо-</text>
  <text x="150" y="334" text-anchor="middle">метр</text>
  <rect x="210" y="295" width="80" height="50" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="250" y="322" text-anchor="middle">УФ-дезинфекция</text>
  <rect x="140" y="400" width="120" height="16" fill="#90a4ae"/>
  <text x="200" y="430" text-anchor="middle">весы-анализатор</text>
  <!-- бок -->
  <rect x="420" y="60" width="120" height="340" rx="14" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
  <text x="480" y="230" text-anchor="middle" transform="rotate(-90 480 230)">плата сбора приборов + 4G</text>
  <!-- размеры -->
  <line x1="80" y1="44" x2="320" y2="44" stroke="#616161"/>
  <text x="200" y="38" text-anchor="middle">600 мм</text>
  <line x1="356" y1="60" x2="356" y2="400" stroke="#616161"/>
  <text x="372" y="230">1 650 мм</text>
  <text x="380" y="456" text-anchor="middle" fill="#555">Прототип 312 тыс. руб.; сеанс 3 мин 10 с; пилот 1 240 измерений, повышенное АД у 7,8 %.</text>
</svg>
