<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" font-size="15" font-weight="bold">АГРОВОЛЬТАИКА-КУБАНЬ: секция 50 кВт над виноградником (вид сбоку)</text>
  <!-- земля -->
  <rect x="40" y="360" width="800" height="26" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="44" y="378" fill="#1b5e20">почва, междурядье 3 м</text>
  <!-- опоры -->
  <rect x="150" y="150" width="14" height="210" fill="#78909c" stroke="#37474f"/>
  <rect x="700" y="150" width="14" height="210" fill="#78909c" stroke="#37474f"/>
  <!-- панели с наклоном 25° -->
  <polygon points="110,170 760,120 760,140 110,190" fill="#1a237e" stroke="#0d47a1" stroke-width="2"/>
  <line x1="240" y1="160" x2="240" y2="180" stroke="#bbdefb" stroke-width="2"/>
  <line x1="370" y1="150" x2="370" y2="170" stroke="#bbdefb" stroke-width="2"/>
  <line x1="500" y1="140" x2="500" y2="160" stroke="#bbdefb" stroke-width="2"/>
  <line x1="630" y1="130" x2="630" y2="150" stroke="#bbdefb" stroke-width="2"/>
  <!-- лоза -->
  <g stroke="#33691e" stroke-width="3">
    <line x1="200" y1="360" x2="200" y2="300"/><line x1="180" y1="315" x2="220" y2="305"/>
    <line x1="330" y1="360" x2="330" y2="300"/><line x1="310" y1="315" x2="350" y2="305"/>
    <line x1="460" y1="360" x2="460" y2="300"/><line x1="440" y1="315" x2="480" y2="305"/>
    <line x1="590" y1="360" x2="590" y2="300"/><line x1="570" y1="315" x2="610" y2="305"/>
  </g>
  <line x1="170" y1="300" x2="640" y2="300" stroke="#5d4037" stroke-width="2"/>
  <text x="210" y="345" fill="#33691e">шпалера, виноград (защита от града: 0,4 % против 17 %)</text>
  <!-- размеры -->
  <line x1="760" y1="140" x2="760" y2="360" stroke="#b71c1c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="768" y="250" fill="#b71c1c">просвет 3,5 м</text>
  <line x1="110" y1="210" x2="760" y2="210" stroke="#b71c1c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="380" y="228" fill="#b71c1c">115 модулей × 435 Вт = 50 кВт</text>
  <!-- солнце и тень -->
  <circle cx="90" cy="70" r="16" fill="#fdd835" stroke="#f57f17"/>
  <line x1="120" y1="90" x2="240" y2="150" stroke="#f57f17" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="40" y="110" fill="#e65100">тень в пиковые часы: −4,3 °С под пологом</text>
  <!-- град -->
  <g fill="#90caf9" stroke="#1565c0">
    <circle cx="560" cy="60" r="4"/><circle cx="590" cy="80" r="3"/><circle cx="620" cy="55" r="4"/>
  </g>
  <text x="520" y="45" fill="#1565c0">град: панели = щит</text>
  <text x="440" y="415" text-anchor="middle" fill="#455a64">Инвертор 50 кВт → винодельня (до 40 % потребления, ~570 тыс. руб./год экономии) и сеть</text>
</svg>
