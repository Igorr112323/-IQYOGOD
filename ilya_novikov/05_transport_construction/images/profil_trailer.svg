<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="840" height="420" fill="#ffffff"/>
  <text x="420" y="24" text-anchor="middle" font-size="15" font-weight="bold">ПРОФИЛЬ-ТР: прицеп П-0 (вид сбоку)</text>
  <!-- автомобиль -->
  <rect x="40" y="140" width="180" height="70" rx="18" fill="#cfd8dc" stroke="#37474f"/>
  <circle cx="90" cy="215" r="22" fill="#37474f"/><circle cx="185" cy="215" r="22" fill="#37474f"/>
  <text x="130" y="130" text-anchor="middle">автомобиль-тягач, до 80 км/ч</text>
  <!-- дышло -->
  <line x1="220" y1="185" x2="330" y2="185" stroke="#37474f" stroke-width="6"/>
  <!-- рама прицепа -->
  <rect x="330" y="150" width="330" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="495" y="175" text-anchor="middle">рама прицепа, 60 кг</text>
  <circle cx="620" cy="215" r="22" fill="#37474f"/>
  <text x="620" y="255" text-anchor="middle">колесо прицепа</text>
  <!-- лазер -->
  <rect x="470" y="190" width="36" height="50" rx="6" fill="#fff59d" stroke="#f57f17" stroke-width="2"/>
  <text x="488" y="270" text-anchor="middle">лазер 100 Гц</text>
  <line x1="488" y1="240" x2="488" y2="300" stroke="#f57f17" stroke-dasharray="3 3"/>
  <!-- дорожное полотно -->
  <path d="M320 300 q 60 -6 120 0 q 60 8 120 0 q 60 -8 120 0" fill="none" stroke="#616161" stroke-width="4"/>
  <text x="495" y="325" text-anchor="middle">покрытие: профиль пишется на 100 Гц</text>
  <!-- электроника -->
  <rect x="360" y="100" width="150" height="34" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="435" y="122" text-anchor="middle">МЭМС + ГЛОНАСС + контроллер</text>
  <line x1="435" y1="134" x2="435" y2="150" stroke="#1565c0"/>
  <rect x="560" y="100" width="120" height="34" rx="6" fill="#fce4ec" stroke="#ad1457"/>
  <text x="620" y="122" text-anchor="middle">продувка кожуха</text>
  <text x="420" y="380" text-anchor="middle" fill="#555">Питание 12 В от тягача; точность 2,1 мм СКЗ (сверка с нивелиром); паспорт участка за один проезд.</text>
</svg>
