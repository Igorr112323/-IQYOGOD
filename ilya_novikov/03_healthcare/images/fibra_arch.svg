<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="Arial" font-size="13">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold">Стелька ФИБРА-СТОПА: 16 решёток Брэгга в одном волокне</text>
  <!-- контур стопы -->
  <path d="M 200 80 C 130 90 100 170 110 250 C 118 320 150 380 220 400 C 290 418 350 390 360 330 C 368 280 340 240 330 200 C 320 150 290 90 240 80 Z" fill="#f6e7d6" stroke="#8a6a4a" stroke-width="2"/>
  <!-- зоны нагрузки -->
  <circle cx="180" cy="150" r="16" fill="#e05c5c" opacity="0.7"/><text x="180" y="155" text-anchor="middle" font-size="10" fill="#fff">1</text>
  <circle cx="230" cy="135" r="14" fill="#e05c5c" opacity="0.55"/><text x="230" y="140" text-anchor="middle" font-size="10" fill="#fff">2</text>
  <circle cx="280" cy="150" r="13" fill="#ffd23f" opacity="0.8"/><text x="280" y="155" text-anchor="middle" font-size="10">3</text>
  <circle cx="310" cy="190" r="12" fill="#ffd23f" opacity="0.8"/><text x="310" y="195" text-anchor="middle" font-size="10">4</text>
  <circle cx="300" cy="240" r="12" fill="#9bc4e8"/><text x="300" y="245" text-anchor="middle" font-size="10">5</text>
  <circle cx="260" cy="280" r="12" fill="#9bc4e8"/><text x="260" y="285" text-anchor="middle" font-size="10">6</text>
  <circle cx="210" cy="310" r="14" fill="#e05c5c" opacity="0.7"/><text x="210" y="315" text-anchor="middle" font-size="10" fill="#fff">7</text>
  <circle cx="250" cy="350" r="15" fill="#e05c5c" opacity="0.7"/><text x="250" y="355" text-anchor="middle" font-size="10" fill="#fff">8</text>
  <!-- змейка волокна -->
  <path d="M 180 150 L 230 135 L 280 150 L 310 190 L 300 240 L 260 280 L 210 310 L 250 350" fill="none" stroke="#2b7de9" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="250" y1="350" x2="420" y2="400" stroke="#2b7de9" stroke-width="2"/>
  <text x="150" y="440" font-size="11" fill="#2b7de9">оптоволокно, точки 1–16 (показаны 8)</text>
  <!-- разъём и интеррогатор -->
  <rect x="420" y="385" width="40" height="26" rx="4" fill="#dfe7ee" stroke="#33475b" stroke-width="1.5"/>
  <text x="440" y="430" text-anchor="middle" font-size="11">разъём</text>
  <rect x="500" y="340" width="220" height="110" rx="10" fill="#eef2f7" stroke="#33475b" stroke-width="2"/>
  <text x="610" y="366" text-anchor="middle" font-weight="bold" font-size="13">Интеррогатор</text>
  <text x="610" y="388" text-anchor="middle" font-size="11">лазер 1520–1570 нм, точность 1 пм</text>
  <text x="610" y="406" text-anchor="middle" font-size="11">опрос 40 с раз в сутки</text>
  <text x="610" y="424" text-anchor="middle" font-size="11">→ МИС</text>
  <line x1="460" y1="398" x2="500" y2="398" stroke="#33475b" stroke-width="2" marker-end="url(#f)"/>
  <defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#33475b"/></marker></defs>
  <!-- формулы -->
  <rect x="470" y="80" width="340" height="200" fill="#f5f8fb" stroke="#33475b" stroke-width="1"/>
  <text x="640" y="106" text-anchor="middle" font-weight="bold" font-size="13">Физика измерения</text>
  <text x="490" y="134" font-size="13">λ_B = 2 · n_эфф · Λ</text>
  <text x="490" y="160" font-size="12">давление: сдвиг периода Λ → Δλ</text>
  <text x="490" y="182" font-size="12">температура: Δn и тепловое расширение</text>
  <text x="490" y="206" font-size="13">σ = E · ε,  ε = Δλ_B / (λ_B·(1 − p_e))</text>
  <text x="490" y="228" font-size="12">p_e = 0,22 (фотоупругий коэффициент)</text>
  <text x="490" y="254" font-size="12">порог риска: ΔT &gt; 2,2 °C, пик &gt; 450 кПа</text>
</svg>
